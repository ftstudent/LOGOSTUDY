<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#232f49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스페인어 카드">
<title>스페인어 빈도사전 카드함 · 1–2500</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #efe7d3;
    --paper-dark: #e4d9bd;
    --card: #f7f2e4;
    --ink: #232f49;
    --ink-soft: #4d5876;
    --rust: #a23e2c;
    --rust-dim: #c96a54;
    --brass: #93732f;
    --brass-light: #ede0bd;
    --line: #cbbd9a;
    --line-soft: #ded2b2;
    --shadow: rgba(35,47,73,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
  }

  body{
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.35), transparent 60%),
      repeating-linear-gradient(0deg, rgba(35,47,73,0.02) 0px, rgba(35,47,73,0.02) 1px, transparent 1px, transparent 3px);
  }

  ::selection{ background: var(--rust); color: var(--card); }

  /* ---------------- Header ---------------- */
  header{
    padding: 28px 32px 24px;
    max-width: 1240px;
    margin: 0 auto;
    border-bottom: 3px double var(--ink);
    position: relative;
  }

  .masthead-line{
    display: grid;
    grid-template-columns: auto minmax(40px, 1fr) auto;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .masthead-code,
  .masthead-edition{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .masthead-code{
    color: var(--rust);
    font-weight: 600;
  }
  .masthead-edition{
    color: var(--ink-soft);
  }
  .masthead-rule{
    height: 1px;
    background: var(--ink);
    opacity: .7;
  }

  h1{
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 48px;
    line-height: 1.12;
    margin: 0;
    letter-spacing: 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
    white-space: nowrap;
  }
  h1 strong{
    font-weight: 800;
  }
  h1 span{
    font-weight: 500;
  }

  .subtitle{
    display: none;
  }

  .header-meta{
    display: none;
  }

  /* ---------------- Controls (drawer label strip) ---------------- */
  .controls-wrap{
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 8px 18px -14px var(--shadow);
  }

  .controls-toggle{
    display: none;
  }

  .data-actions{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
  }
  .data-actions .toggle-btn{
    margin-top: 0;
    padding-right: 8px;
    padding-left: 8px;
  }
  .mobile-label{
    display: none;
  }

  .controls{
    max-width: 1240px;
    margin: 0 auto;
    padding: 12px 32px 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
  }

  .collection-tools{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
  }
  .collection-switch{
    display: inline-flex;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--card);
  }
  .collection-tab{
    min-height: 28px;
    padding: 5px 9px;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
  }
  .collection-tab:hover{
    border-color: transparent;
    background: var(--paper-dark);
    color: var(--ink);
  }
  .collection-tab.active{
    background: var(--ink);
    color: var(--paper);
  }
  .custom-add-btn{
    min-height: 32px;
    padding: 5px 9px;
    background: var(--rust);
    border-color: var(--rust);
  }
  .custom-add-btn[hidden]{ display: none; }

  .field{
    position: relative;
    display: flex;
    align-items: center;
  }

  .field-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    position: absolute;
    top: -13px;
    left: 2px;
  }

  input[type="search"], input[type="number"]{
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 10px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="search"]:focus, input[type="number"]:focus{
    border-color: var(--rust);
    box-shadow: 0 0 0 3px rgba(162,62,44,0.12);
  }
  input[type="search"]{ width: 200px; }
  input[type="number"]{ width: 76px; }

  .search-field{ margin-top: 10px; }
  .jump-field{ margin-top: 10px; }

  #jumpForm{ display:flex; gap:8px; align-items:center; }
  #jumpForm[hidden]{ display: none; }

  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    cursor: pointer;
    border-radius: 3px;
    padding: 7px 10px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    transition: background .15s ease, color .15s ease, transform .1s ease;
  }
  button:hover{ background: var(--rust); border-color: var(--rust); }
  button:active{ transform: translateY(1px); }

  .toggle-btn{
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    margin-top: 10px;
  }
  .toggle-btn[aria-pressed="true"]{
    background: var(--rust);
    color: var(--card);
    border-color: var(--rust);
  }

  .spacer{ flex: 1; }

  .result-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .result-count b{ color: var(--rust); font-weight: 600; }

  .pos-tools{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
  }
  .pos-toggle{
    width: 28px;
    height: 28px;
    min-height: 28px;
    padding: 0;
    border-color: var(--line);
    background: var(--card);
    color: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .pos-toggle:hover,
  .pos-toggle.has-active{
    border-color: var(--rust);
    background: var(--card);
    color: var(--rust);
  }
  .pos-toggle-icon{
    width: 7px;
    height: 7px;
    margin-top: -3px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
    transition: transform .16s ease, margin .16s ease;
  }
  .pos-toggle[aria-expanded="true"] .pos-toggle-icon{
    margin-top: 3px;
    transform: rotate(225deg);
  }

  /* POS chips row */
  .pos-row{
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pos-row[hidden]{ display: none; }
  .pos-chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 4px 8px 4px 7px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .12s ease;
  }
  .pos-chip .count{
    font-size: 9px;
    color: var(--brass);
    background: var(--brass-light);
    border-radius: 999px;
    padding: 1px 5px;
  }
  .pos-chip:hover{ border-color: var(--brass); }
  .pos-chip.active{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .pos-chip.active .count{ background: var(--rust); color: var(--paper); }

  .fav-chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--rust);
    background: var(--card);
    color: var(--rust);
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .12s ease;
  }
  .fav-chip.active{
    background: var(--rust);
    color: var(--paper);
  }
  .fav-chip .count{
    font-size: 9.5px;
    background: var(--brass-light);
    color: var(--brass);
    border-radius: 999px;
    padding: 1px 5px;
  }
  .fav-chip.active .count{ background: var(--paper); color: var(--rust); }
  .date-filter-btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .date-filter-value{
    color: var(--rust);
    font-weight: 600;
  }
  .sync-status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    align-self: center;
    min-height: 16px;
  }
  .sync-status.ok{ color: var(--brass); }
  .sync-status.err{ color: var(--rust); }

  /* ---------------- Date dialogs ---------------- */
  dialog{
    width: min(380px, calc(100vw - 32px));
    max-height: min(620px, calc(100dvh - 32px));
    padding: 0;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 8px 10px 0 rgba(35,47,73,.18);
  }
  dialog::backdrop{
    background: rgba(35,47,73,.42);
  }
  .dialog-shell{
    padding: 18px;
  }
  .dialog-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ink);
  }
  .dialog-title{
    margin: 0;
    font-size: 17px;
    line-height: 1.3;
  }
  .dialog-close{
    width: 34px;
    height: 34px;
    min-height: 34px;
    padding: 0;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
  }
  .dialog-target{
    margin: 14px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--rust);
  }
  .date-tag-form{
    display: grid;
    gap: 8px;
  }
  .date-tag-form label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--brass);
  }
  input[type="date"]{
    width: 100%;
    min-height: 44px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
    font: 14px 'IBM Plex Mono', monospace;
  }
  .dialog-actions{
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
  }
  .dialog-actions .toggle-btn{
    margin-top: 0;
  }
  .date-filter-list{
    max-height: min(440px, calc(100dvh - 150px));
    overflow-y: auto;
    margin-top: 12px;
    border-top: 1px solid var(--line);
  }
  .date-filter-option{
    width: 100%;
    min-height: 44px;
    padding: 10px 8px;
    border: 0;
    border-bottom: 1px solid var(--line-soft);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .date-filter-option:hover,
  .date-filter-option.active{
    background: var(--card);
    color: var(--rust);
  }
  .date-filter-option .count{
    min-width: 28px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--brass-light);
    color: var(--brass);
    text-align: center;
    font-size: 10px;
  }
  .date-filter-empty{
    margin: 0;
    padding: 20px 8px 8px;
    color: var(--ink-soft);
    font-size: 12px;
    text-align: center;
  }

  dialog.review-dialog{
    width: min(520px, calc(100vw - 32px));
  }
  .review-toolbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
  }
  .review-toolbar-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--brass);
  }
  .review-list-actions{
    display: flex;
    gap: 5px;
  }
  .review-list-action{
    min-height: 30px;
    padding: 5px 8px;
    border-color: var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-size: 10px;
  }
  .review-date-list{
    max-height: min(280px, calc(100dvh - 360px));
    overflow-y: auto;
    margin-top: 8px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .review-date-option{
    min-height: 42px;
    padding: 8px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
  }
  .review-date-option:last-child{ border-bottom: 0; }
  .review-date-option:hover{ background: var(--card); }
  .review-date-option:has(input:checked){
    background: var(--card);
    color: var(--rust);
  }
  .review-date-option input{
    width: 17px;
    height: 17px;
    margin: 0;
    accent-color: var(--rust);
    flex: 0 0 auto;
  }
  .review-date-text{
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .review-date-count{
    min-width: 30px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--brass-light);
    color: var(--brass);
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
  }
  .review-fields{
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .review-number-field{
    display: grid;
    gap: 6px;
  }
  .review-number-field label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--brass);
  }
  .review-number-field input[type="number"]{
    width: 100%;
    min-height: 40px;
  }
  .review-scope-summary{
    min-height: 20px;
    margin: 12px 0 0;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }
  .review-scope-summary strong{ color: var(--rust); }
  .review-constraint-note{
    min-height: 18px;
    margin: 3px 0 0;
    color: var(--brass);
    font-size: 11px;
  }
  #reviewSubmitBtn:disabled{
    cursor: not-allowed;
    opacity: .42;
  }

  dialog.card-editor-dialog{
    width: min(560px, calc(100vw - 32px));
  }
  .card-editor-form{
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .editor-field{
    display: grid;
    gap: 6px;
  }
  .editor-field.full{ grid-column: 1 / -1; }
  .editor-field label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--brass);
  }
  .editor-field input,
  .editor-field select,
  .editor-field textarea{
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    font: 13px 'Noto Sans KR', sans-serif;
  }
  .editor-field textarea{
    min-height: 68px;
    resize: vertical;
    line-height: 1.5;
  }
  .editor-field input:focus,
  .editor-field select:focus,
  .editor-field textarea:focus{
    border-color: var(--rust);
    box-shadow: 0 0 0 3px rgba(162,62,44,0.12);
  }
  .required-mark{ color: var(--rust); }

  /* ---------------- Grid ---------------- */
  main{
    max-width: 1240px;
    margin: 0 auto;
    padding: 30px 32px 10px;
  }

  #grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }

  .card{
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 20px 18px 16px;
    box-shadow: 2px 3px 0 var(--line-soft);
    transition: transform .12s ease, box-shadow .12s ease;
    animation: rise .28s ease both;
  }
  .card:hover{
    transform: translate(-2px,-2px);
    box-shadow: 4px 5px 0 var(--line-soft);
  }
  .card.flash{ animation: rise .28s ease both, flashHL 1.1s ease; }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes flashHL{
    0%{ box-shadow: 0 0 0 3px var(--rust); }
    100%{ box-shadow: 2px 3px 0 var(--line-soft); }
  }

  .card::before{
    content: "";
    position: absolute;
    top: 0; left: 18px;
    width: 30px; height: 6px;
    background: var(--paper);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  .card-top{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 8px;
  }

  .rank-tab{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--paper);
    background: var(--rust);
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.02em;
  }

  .rank-group{
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .star-btn{
    background: none;
    border: none;
    padding: 0;
    font-size: 18px;
    line-height: 1;
    color: var(--line);
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
  }
  .star-btn:hover{ color: var(--brass); background: none; transform: scale(1.1); }
  .star-btn.active{ color: var(--rust); }
  .star-btn.active::before{ content: "\2605"; }
  .star-btn:not(.active)::before{ content: "\2606"; }

  .pos-tag{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--brass);
    background: var(--brass-light);
    padding: 3px 8px;
    border-radius: 2px;
    text-align: right;
    line-height: 1.5;
  }
  .pos-tag .kr{ color: var(--ink-soft); margin-left: 4px; }

  .headword{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.2;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .meaning{
    font-size: 14.5px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }

  .meaning.hidden-mode,
  .example-en.hidden-mode{
    filter: blur(6px);
    user-select: none;
    transition: filter .15s ease;
  }
  .card.translation-visible .meaning.hidden-mode,
  .card.translation-visible .example-en.hidden-mode{
    filter: blur(0px);
  }
  #grid.translation-test-mode .card{
    cursor: pointer;
  }

  .divider{
    border: none;
    border-top: 1px dashed var(--line);
    margin: 0 0 12px;
  }

  .example-es{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .example-es::before{ content: "\201C"; color: var(--rust); }
  .example-es::after{ content: "\201D"; color: var(--rust); }

  .example-en{
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 14px;
  }

  .card-foot{
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--line);
  }
  .card-foot > .page-ref{
    border-top: 1px solid var(--line-soft);
    padding-top: 6px;
  }
  .card-tools{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-right: auto;
  }
  .custom-card-actions{
    display: inline-flex;
    gap: 5px;
  }
  .custom-card-action{
    width: 28px;
    height: 28px;
    min-height: 28px;
    padding: 0;
    border-color: var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-size: 15px;
  }
  .custom-card-action:hover{
    color: var(--rust);
    background: var(--paper-dark);
    border-color: var(--rust);
  }
  .memo-btn{
    min-height: 28px;
    padding: 4px 8px;
    border-color: var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-size: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .memo-btn:hover,
  .memo-btn.has-note{
    border-color: var(--brass);
    background: var(--paper-dark);
    color: var(--brass);
  }
  .memo-dot{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: .25;
  }
  .memo-btn.has-note .memo-dot{
    background: var(--rust);
    opacity: 1;
  }

  dialog.memo-dialog{
    width: min(520px, calc(100vw - 32px));
  }
  .memo-editor{
    display: grid;
    gap: 7px;
    margin-top: 14px;
  }
  .memo-editor label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--brass);
  }
  .memo-toolbar{
    min-height: 38px;
    padding: 4px;
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 3px 3px 0 0;
    background: var(--paper-dark);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }
  .memo-font-select{
    width: 96px;
    height: 30px;
    min-height: 30px;
    padding: 0 24px 0 8px;
    border: 1px solid transparent;
    border-radius: 3px;
    background-color: transparent;
    color: var(--ink);
    font: 11px/1 'Noto Sans KR', sans-serif;
    cursor: pointer;
  }
  .memo-font-select:hover,
  .memo-font-select:focus{
    border-color: var(--line);
    background-color: var(--card);
    outline: none;
  }
  .memo-font-select option[value="sans"]{ font-family: 'Noto Sans KR', sans-serif; }
  .memo-font-select option[value="serif"]{ font-family: 'Noto Serif KR', serif; }
  .memo-font-select option[value="editorial"]{ font-family: 'Fraunces', 'Noto Serif KR', serif; }
  .memo-font-select option[value="mono"]{ font-family: 'Nanum Gothic Coding', monospace; }
  .memo-format-btn,
  .memo-color-btn{
    width: 30px;
    height: 30px;
    min-height: 30px;
    padding: 0;
    border-color: transparent;
    background: transparent;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .memo-format-btn{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 700;
  }
  .memo-format-btn[data-command="italic"]{
    font-style: italic;
    font-weight: 600;
  }
  .memo-format-btn[data-command="underline"]{
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .memo-format-btn:hover,
  .memo-color-btn:hover{
    border-color: var(--line);
    background: var(--card);
    color: var(--ink);
  }
  .memo-format-btn[aria-pressed="true"]{
    border-color: var(--rust);
    background: var(--card);
    color: var(--rust);
  }
  .memo-toolbar-rule{
    width: 1px;
    height: 20px;
    margin: 0 3px;
    background: var(--line);
  }
  .memo-color-tools{
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .memo-swatch{
    width: 15px;
    height: 15px;
    border: 1px solid rgba(35,47,73,.18);
    border-radius: 50%;
    background: var(--memo-swatch);
  }
  .memo-color-ink{ --memo-swatch: #232f49; }
  .memo-color-rust{ --memo-swatch: #a23e2c; }
  .memo-color-brass{ --memo-swatch: #876928; }
  .memo-color-teal{ --memo-swatch: #486f6b; }
  .memo-color-plum{ --memo-swatch: #71586f; }
  .memo-input{
    width: 100%;
    min-height: 220px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 0 0 3px 3px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 14px/1.65 'Noto Sans KR', sans-serif;
  }
  .memo-input:empty::before{
    content: attr(data-placeholder);
    color: var(--ink-soft);
    opacity: .55;
    pointer-events: none;
  }
  .memo-input:focus{
    border-color: var(--rust);
    box-shadow: 0 0 0 3px rgba(162,62,44,0.12);
  }
  .memo-input [data-memo-color="ink"]{ color: #232f49; }
  .memo-input [data-memo-color="rust"]{ color: #a23e2c; }
  .memo-input [data-memo-color="brass"]{ color: #876928; }
  .memo-input [data-memo-color="teal"]{ color: #486f6b; }
  .memo-input [data-memo-color="plum"]{ color: #71586f; }
  .memo-input [data-memo-font="sans"]{ font-family: 'Noto Sans KR', sans-serif; }
  .memo-input [data-memo-font="serif"]{ font-family: 'Noto Serif KR', serif; }
  .memo-input [data-memo-font="editorial"]{ font-family: 'Fraunces', 'Noto Serif KR', serif; }
  .memo-input [data-memo-font="mono"]{ font-family: 'Nanum Gothic Coding', monospace; }
  .memo-clear-btn{
    margin-right: auto;
    color: var(--rust);
  }

  .card-date-tags{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 2px 0 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--line-soft);
  }
  .date-tag-chip{
    min-height: 28px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 5px 3px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
  }
  .date-tag-remove{
    width: 20px;
    height: 20px;
    min-height: 20px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--rust);
    font-size: 14px;
    line-height: 1;
  }
  .date-tag-remove:hover{
    background: var(--rust);
    color: var(--paper);
  }
  .date-tag-add{
    min-height: 28px;
    padding: 4px 8px;
    border: 1px dashed var(--brass);
    border-radius: 999px;
    background: transparent;
    color: var(--brass);
    font-size: 10px;
  }

  #sentinel{ height: 1px; }

  .empty-state{
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  /* ---------------- Legend ---------------- */
  #legend-section{
    max-width: 1240px;
    margin: 60px auto 0;
    padding: 0 32px 60px;
  }
  .legend-toggle{
    background: none;
    border: none;
    border-bottom: 1px solid var(--ink);
    color: var(--ink);
    padding: 0 0 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .legend-toggle:hover{ background:none; color: var(--rust); border-color: var(--rust); }
  .legend-toggle .arrow{ transition: transform .2s ease; display:inline-block; }
  .legend-toggle[aria-expanded="true"] .arrow{ transform: rotate(90deg); }

  #legend-table-wrap{
    display: none;
    margin-top: 22px;
    border-top: 2px solid var(--ink);
  }
  #legend-table-wrap.open{ display: block; }

  table.legend{
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.legend th{
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brass);
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  table.legend td{
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--ink-soft);
  }
  table.legend td.abbr{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--rust);
    font-weight: 600;
  }
  table.legend td.kr{ color: var(--ink); font-weight: 500; }
  table.legend tr:hover td{ background: var(--card); }

  footer{
    text-align: center;
    padding: 26px 20px 50px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 640px){
    header{
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      border-bottom: 2px solid var(--ink);
    }
    .masthead-line{
      grid-template-columns: auto minmax(24px, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }
    .masthead-code{
      font-size: 8.5px;
    }
    .masthead-edition{
      display: none;
    }
    h1{
      font-size: 25px;
      line-height: 1.15;
      gap: 8px;
    }
    h1 span{ font-weight: 500; }

    .controls-wrap{
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      transition: transform .18s ease;
      will-change: transform;
    }
    .controls-wrap.mobile-hidden{
      transform: translateY(calc(-100% - env(safe-area-inset-top, 0px)));
    }
    .controls-wrap.is-collapsed{
      background: transparent;
      border-bottom-color: transparent;
      box-shadow: none;
    }
    .controls-toggle{
      width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      margin: 6px 12px 6px auto;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--card);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 var(--line-soft);
    }
    .controls-toggle:hover{
      background: var(--paper-dark);
      color: var(--ink);
      border-color: var(--line);
    }
    .controls-icon{
      font-size: 21px;
      line-height: 1;
      transition: transform .18s ease, color .18s ease;
    }
    .controls-toggle[aria-expanded="true"] .controls-icon{
      color: var(--rust);
      transform: rotate(45deg);
    }
    .controls-wrap.is-collapsed .controls-panel{
      display: none;
    }
    .controls-panel{
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 56px);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 14px 24px -18px var(--ink);
    }
    .controls{
      padding: 10px 16px 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }
    .controls > *{
      min-width: 0;
    }
    .collection-tools{
      grid-column: 1 / -1;
      margin-top: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
    }
    .collection-switch{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .collection-tab{
      min-width: 0;
      padding: 6px 5px;
      white-space: nowrap;
    }
    .search-field,
    .jump-field,
    .data-actions{
      grid-column: 1 / -1;
    }
    .search-field,
    .jump-field,
    .toggle-btn,
    .fav-filter-field{
      margin-top: 0 !important;
    }
    .search-field{
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 5px;
      align-items: end;
    }
    .jump-field,
    #jumpForm{
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px 8px;
      align-items: end;
    }
    .field-label{
      position: static;
      grid-column: 1 / -1;
      line-height: 1.2;
      padding-left: 2px;
    }
    input[type="search"]{
      width: 100%;
    }
    #jumpForm{
      width: 100%;
    }
    #jumpForm input{
      flex: 1;
      width: auto;
      min-width: 0;
    }
    input[type="search"],
    input[type="number"],
    button,
    .fav-chip{
      min-height: 42px;
    }
    button{
      padding: 8px 9px;
      font-size: 11px;
    }
    .fav-chip{
      width: 100%;
      justify-content: center;
      min-height: 42px;
    }
    .date-filter-btn{
      margin-top: 0;
    }
    .data-actions{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 0;
    }
    .data-actions .toggle-btn{
      width: 100%;
      padding: 7px 2px;
      font-size: 10.5px;
      white-space: nowrap;
    }
    .desktop-label{
      display: none;
    }
    .mobile-label{
      display: inline;
    }
    .sync-status{
      font-size: 10px;
      align-self: center;
    }
    .spacer{
      display: none;
    }
    .result-count{
      text-align: right;
      align-self: center;
    }
    .pos-tools{
      margin-top: 0;
      justify-content: flex-end;
    }

    .pos-row{
      padding: 8px 16px 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .pos-row::-webkit-scrollbar{
      display: none;
    }
    .pos-chip{
      flex: 0 0 auto;
      min-height: 32px;
    }

    main{
      padding: 14px 16px 10px;
    }
    #grid{
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }
    .card{
      padding: 18px 16px 14px;
    }
    .date-tag-add{ min-height: 28px; }
    .date-tag-remove{ min-height: 20px; }

    #legend-section{
      margin-top: 36px;
      padding: 0 16px 40px;
      overflow-x: auto;
    }
    table.legend{
      min-width: 620px;
    }
    dialog{
      width: min(380px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
    }
    dialog.review-dialog{
      width: calc(100vw - 24px);
    }
    dialog.card-editor-dialog{
      width: calc(100vw - 24px);
    }
    dialog.memo-dialog{
      width: calc(100vw - 24px);
    }
    .memo-input{
      min-height: 250px;
    }
    .card-editor-form{
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }
    .editor-field.full{ grid-column: auto; }
    .review-date-list{
      max-height: min(260px, calc(100dvh - 350px));
    }
  }

  @media (max-width: 360px){
    h1{ font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .card.flash{ animation: none; }
  }
</style>
</head>
<body>

<header>
  <div class="masthead-line">
    <span class="masthead-code">ES / 0001—2500</span>
    <span class="masthead-rule" aria-hidden="true"></span>
    <span class="masthead-edition">Frequency archive · study edition</span>
  </div>
  <h1><strong>스페인어</strong><span>빈도사전 카드함</span></h1>
</header>

<div class="controls-wrap is-collapsed" id="controlsWrap">
  <button type="button" class="controls-toggle" id="controlsToggle" aria-expanded="false" aria-controls="controlsPanel" aria-label="검색, 필터 및 동기화 열기" title="검색, 필터 및 동기화">
    <span class="controls-icon" aria-hidden="true">⚙</span>
  </button>
  <div class="controls-panel" id="controlsPanel">
  <div class="controls">
    <div class="collection-tools">
      <div class="collection-switch" role="tablist" aria-label="단어 세트 선택">
        <button type="button" class="collection-tab active" id="builtinSetBtn" role="tab" aria-selected="true">빈도사전</button>
        <button type="button" class="collection-tab" id="customSetBtn" role="tab" aria-selected="false">내가 추가한 세트</button>
      </div>
      <button type="button" class="custom-add-btn" id="customAddBtn" aria-haspopup="dialog" hidden>+ 단어 추가</button>
    </div>
    <div class="field search-field">
      <span class="field-label">검색</span>
      <input type="search" id="searchInput" placeholder="스페인어 · 영어 뜻 · 예문 검색" autocomplete="off">
    </div>
    <form id="jumpForm" class="field jump-field">
      <span class="field-label">순위 이동</span>
      <input type="number" id="jumpInput" placeholder="1–2500" min="1" max="2500">
      <button type="submit">이동</button>
    </form>
    <button type="button" id="hideToggle" class="toggle-btn" aria-pressed="false">해석 숨기기</button>
    <button type="button" id="reviewBtn" class="toggle-btn" aria-haspopup="dialog">복습 추출</button>
    <div class="field fav-filter-field" style="margin-top:12px;">
      <div class="fav-chip" id="favOnlyChip"><span>★ 즐겨찾기만</span><span class="count" id="favCount">0</span></div>
    </div>
    <button type="button" id="dateFilterBtn" class="toggle-btn date-filter-btn" aria-haspopup="dialog" aria-pressed="false">날짜별 보기 <span class="date-filter-value" id="dateFilterValue">전체</span></button>
    <div class="data-actions" aria-label="즐겨찾기 및 클라우드 데이터">
      <button type="button" id="favExportBtn" class="toggle-btn" title="즐겨찾기 순위를 클립보드에 복사"><span class="desktop-label">즐겨찾기 내보내기</span><span class="mobile-label">내보내기</span></button>
      <button type="button" id="favImportBtn" class="toggle-btn" title="복사해둔 순위 목록을 붙여넣어 복원"><span class="desktop-label">즐겨찾기 가져오기</span><span class="mobile-label">가져오기</span></button>
      <button type="button" id="cloudLoadBtn" class="toggle-btn" title="클라우드에서 학습 데이터 불러오기"><span class="desktop-label">클라우드 불러오기</span><span class="mobile-label">불러오기</span></button>
      <button type="button" id="cloudSaveBtn" class="toggle-btn" title="학습 데이터를 클라우드에 저장"><span class="desktop-label">클라우드 저장</span><span class="mobile-label">저장</span></button>
    </div>
    <div class="sync-status" id="syncStatus">클라우드 연결 중...</div>
    <div class="spacer"></div>
    <div class="pos-tools">
      <button type="button" class="pos-toggle" id="posToggle" aria-expanded="false" aria-controls="posRow" aria-label="품사 필터 펼치기" title="품사 필터 펼치기">
        <span class="pos-toggle-icon" aria-hidden="true"></span>
      </button>
      <div class="result-count" id="resultCount"></div>
    </div>
  </div>
  <div class="pos-row" id="posRow" hidden></div>
  </div>
</div>

<dialog id="dateTagDialog" aria-labelledby="dateTagDialogTitle">
  <div class="dialog-shell">
    <div class="dialog-head">
      <h2 class="dialog-title" id="dateTagDialogTitle">날짜 태그 추가</h2>
      <button type="button" class="dialog-close" data-dialog-close="dateTagDialog" aria-label="닫기">×</button>
    </div>
    <p class="dialog-target" id="dateTagTarget"></p>
    <div class="date-tag-form">
      <label for="dateTagInput">직접 날짜 선택</label>
      <input type="date" id="dateTagInput" autocomplete="off" required>
    </div>
    <div class="dialog-actions">
      <button type="button" class="toggle-btn" data-dialog-close="dateTagDialog">취소</button>
      <button type="button" id="dateTagSaveBtn">태그 추가</button>
    </div>
  </div>
</dialog>

<dialog id="dateFilterDialog" aria-labelledby="dateFilterDialogTitle">
  <div class="dialog-shell">
    <div class="dialog-head">
      <h2 class="dialog-title" id="dateFilterDialogTitle">날짜별 학습 범위</h2>
      <button type="button" class="dialog-close" data-dialog-close="dateFilterDialog" aria-label="닫기">×</button>
    </div>
    <div class="date-filter-list" id="dateFilterList"></div>
  </div>
</dialog>

<dialog id="reviewDialog" class="review-dialog" aria-labelledby="reviewDialogTitle">
  <form id="reviewForm" class="dialog-shell">
    <div class="dialog-head">
      <h2 class="dialog-title" id="reviewDialogTitle">날짜 묶음 복습</h2>
      <button type="button" class="dialog-close" data-dialog-close="reviewDialog" aria-label="닫기">×</button>
    </div>
    <div class="review-toolbar">
      <span class="review-toolbar-label">학습 날짜</span>
      <div class="review-list-actions">
        <button type="button" class="review-list-action" id="reviewSelectAllBtn">전체 선택</button>

        ? node.dataset.memoFont
        : memoFontNamesByValue[canonicalFont(style.fontFamily || node.getAttribute('face'))];
      const isBold = tag === 'strong' || tag === 'b' || /^(bold|[6-9]00)$/i.test(style.fontWeight);
      const isItalic = tag === 'em' || tag === 'i' || /^(italic|oblique)$/i.test(style.fontStyle);
      const isUnderlined = tag === 'u' || /\bunderline\b/i.test(style.textDecorationLine || style.textDecoration);
      const isBlock = tag === 'div' || tag === 'p';

      let clean = document.createDocumentFragment();
      [...node.childNodes].forEach(child => clean.appendChild(cleanNode(child)));

      function wrap(tagName, content){
        const wrapper = document.createElement(tagName);
        wrapper.appendChild(content);
        return wrapper;
      }

      if (isUnderlined) clean = wrap('u', clean);
      if (isItalic) clean = wrap('em', clean);
      if (isBold) clean = wrap('strong', clean);
      if (namedColor) {
        clean = wrap('span', clean);
        clean.dataset.memoColor = namedColor;
      }
      if (namedFont) {
        clean = wrap('span', clean);
        clean.dataset.memoFont = namedFont;
      }
      if (isBlock) clean = wrap('div', clean);
      return clean;
    }

    const output = document.createElement('div');
    [...template.content.childNodes].forEach(child => output.appendChild(cleanNode(child)));
    return output.innerHTML;
  }

  function plainTextToMemoHTML(value){
    return escapeHTML(String(value || '')).replace(/\r?\n/g, '<br>');
  }

  function memoHTMLHasContent(html){
    const holder = document.createElement('div');
    holder.innerHTML = sanitizeMemoHTML(html);
    return Boolean(holder.textContent.replace(/\u00a0/g, ' ').trim());
  }

  function normalizeCardNotes(value){
    const normalized = {};
    if (!value || typeof value !== 'object' || Array.isArray(value)) return normalized;
    Object.entries(value).forEach(([key, raw]) => {
      if (!isValidCardKey(key) || !raw || typeof raw !== 'object') return;
      const updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : '';
      if (!updatedAt) return;
      const sourceHTML = typeof raw.html === 'string'
        ? raw.html
        : plainTextToMemoHTML(raw.text);
      normalized[key] = { html: sanitizeMemoHTML(sourceHTML), updatedAt };
    });
    return normalized;
  }

  function mergeCardNotes(...maps){
    const merged = {};
    maps.forEach(map => {
      Object.entries(normalizeCardNotes(map)).forEach(([key, note]) => {
        if (!merged[key] || note.updatedAt >= merged[key].updatedAt) merged[key] = note;
      });
    });
    return merged;
  }

  function localCardNotes(){
    try {

    } catch {

  function noteHTML(key){

  function hasCardNote(key){

  function setCardNote(key, html){

    saveLocalCardNotes();
  }

  function normalizeCustomCards(value){
    if (!Array.isArray(value)) return [];
    const byId = new Map();
    value.forEach(raw => {
      if (!raw || typeof raw !== 'object' || typeof raw.id !== 'string' || !raw.id) return;
      const seq = Number(raw.seq);
      const updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : new Date(0).toISOString();
      const card = {
        id: raw.id,
        seq: Number.isInteger(seq) && seq > 0 ? seq : 1,
        custom: true,
        word: String(raw.word || '').trim().slice(0, 120),
        en: String(raw.en || '').trim().slice(0, 300),
        pos: String(raw.pos || 'n').slice(0, 20),
        pos_kr: String(raw.pos_kr || '명사(성 미표기)').slice(0, 40),
        ex_es: String(raw.ex_es || '').trim().slice(0, 600),
        ex_en: String(raw.ex_en || '').trim().slice(0, 600),
        favorite: Boolean(raw.favorite),
        dates: Array.isArray(raw.dates) ? [...new Set(raw.dates.filter(isValidDateTag))].sort() : [],
        createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : updatedAt,
        updatedAt,
        deletedAt: typeof raw.deletedAt === 'string' ? raw.deletedAt : '',
      };
      const previous = byId.get(card.id);
      if (!previous || card.updatedAt >= previous.updatedAt) byId.set(card.id, card);
    });
    return [...byId.values()].sort((a, b) => a.seq - b.seq || a.createdAt.localeCompare(b.createdAt));
  }

  function mergeCustomCards(...lists){
    return normalizeCustomCards(lists.flat());
  }

  function localCustomCards(){
    try {
      return normalizeCustomCards(JSON.parse(localStorage.getItem(CUSTOM_CARDS_STORAGE_KEY) || '[]'));

  async function loadCloudState({ manual = false } = {}){
    try {
      setSyncStatus('클라우드에서 학습 데이터 불러오는 중...');
      const { data, error } = await supabase
        .from(CLOUD_TABLE)
        .select('data,updated_at')
        .eq('id', CLOUD_ROW_ID)
        .maybeSingle();
      if (error) throw error;

      const remoteRanks = validRanks(data?.data?.[CLOUD_DATA_KEY]);
      const remoteDateTags = normalizeDateTags(data?.data?.[CLOUD_DATE_TAGS_KEY]);
      const remoteCustomCards = normalizeCustomCards(data?.data?.[CLOUD_CUSTOM_CARDS_KEY]);
      const remoteCardNotes = normalizeCardNotes(data?.data?.[CLOUD_NOTES_KEY]);
      favorites = new Set([...favorites, ...remoteRanks]);
      dateTags = mergeDateTags(dateTags, remoteDateTags);
      customCards = mergeCustomCards(customCards, remoteCustomCards);
      cardNotes = mergeCardNotes(cardNotes, remoteCardNotes);
      saveLocalFavorites();
      saveLocalDateTags();
      saveLocalCustomCards();
      saveLocalCardNotes();
      updateFavCount();
      refreshFavoriteButtons();
      refreshMemoButtons();
      refreshDateTagRows();
      updateDateFilterButton();
      if (reviewDialog.open) renderReviewDateList();
      if (favOnly || activeDateFilter || manual) applyFilters();
      setSyncStatus(
        data?.updated_at
          ? `클라우드 동기화 완료 · ${new Date(data.updated_at).toLocaleTimeString('ko-KR')}`
          : '클라우드 동기화 완료',
        'ok'
      );
    } catch (error) {
      console.error(error);
      setSyncStatus(`클라우드 불러오기 실패: ${error.message}`, 'err');
    }
  }

  async function saveCloudState({ manual = false } = {}){
    saveLocalFavorites();
    saveLocalDateTags();
    saveLocalCustomCards();
    saveLocalCardNotes();
    try {
      setSyncStatus(manual ? '클라우드에 수동 저장 중...' : '클라우드에 학습 데이터 저장 중...');
      const { data: current, error: loadError } = await supabase
        .from(CLOUD_TABLE)
        .select('data')
        .eq('id', CLOUD_ROW_ID)
        .maybeSingle();
      if (loadError) throw loadError;

      const nextData = {
        ...(current?.data || {}),
        [CLOUD_DATA_KEY]: Array.from(favorites).sort((a,b) => a-b),
        [CLOUD_DATE_TAGS_KEY]: normalizeDateTags(dateTags),
        [CLOUD_CUSTOM_CARDS_KEY]: normalizeCustomCards(customCards),
        [CLOUD_NOTES_KEY]: normalizeCardNotes(cardNotes),
      };
      const { error } = await supabase
        .from(CLOUD_TABLE)
        .update({ data: nextData, updated_at: new Date().toISOString() })
        .eq('id', CLOUD_ROW_ID);
      if (error) throw error;
      setSyncStatus(`클라우드 저장 완료 · ${new Date().toLocaleTimeString('ko-KR')}`, 'ok');
    } catch (error) {
      console.error(error);
      setSyncStatus(`클라우드 저장 실패: ${error.message}`, 'err');
    }
  }

  function queueCloudSave(){
    saveLocalFavorites();
    saveLocalDateTags();
    saveLocalCustomCards();
    saveLocalCardNotes();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCloudState, AUTO_SAVE_DELAY);
  }

  function updateFavCount(){
    const count = currentSource().filter(isFavorite).length;
    favCount.textContent = count;
  }

  function formatDateTag(date){
    return date.replace(/-/g, '.');
  }

  function cardDateTagsInnerHTML(item){
    const key = itemKey(item);
    const tags = itemDates(item);
    return tags.map(date => `
      <span class="date-tag-chip">
        <span>${formatDateTag(date)}</span>
        <button type="button" class="date-tag-remove" data-key="${key}" data-date="${date}" aria-label="${formatDateTag(date)} 태그 삭제">×</button>
      </span>`).join('') + `
      <button type="button" class="date-tag-add" data-key="${key}" aria-label="날짜 태그 추가">+ 날짜</button>`;
  }

  function refreshDateTagRows(){
    document.querySelectorAll('[data-date-tags-key]').forEach(row => {
      const item = itemByKey(row.dataset.dateTagsKey);
      if (item) row.innerHTML = cardDateTagsInnerHTML(item);
    });

  function dateTagCounts(items = [...DATA, ...visibleCustomCards()]){
    const counts = new Map();
    items.forEach(item => {
      itemDates(item).forEach(date => counts.set(date, (counts.get(date) || 0) + 1));
    });
    return [...counts.entries()].sort(([a], [b]) => b.localeCompare(a));
  }

  function updateDateFilterButton(){
    const active = Boolean(activeDateFilter);
    dateFilterBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
    dateFilterValue.textContent = active ? formatDateTag(activeDateFilter) : '전체';
  }

  function renderDateFilterList(){
    const source = currentSource();
    const entries = dateTagCounts(source);
    const allActive = activeDateFilter === '' ? ' active' : '';
    const options = [`
      <button type="button" class="date-filter-option${allActive}" data-filter-date="">
        <span>전체 날짜</span><span class="count">${source.length.toLocaleString()}</span>
      </button>`];
    entries.forEach(([date, count]) => {
      const active = date === activeDateFilter ? ' active' : '';
      options.push(`
        <button type="button" class="date-filter-option${active}" data-filter-date="${date}">
          <span>${formatDateTag(date)}</span><span class="count">${count}</span>
        </button>`);
    });
    if (!entries.length) options.push('<p class="date-filter-empty">아직 추가한 날짜 태그가 없습니다.</p>');
    dateFilterList.innerHTML = options.join('');
  }

  function reviewPool(){
    if (!selectedReviewDates.size) return [];
    return [...DATA, ...visibleCustomCards()].filter(item =>
      itemDates(item).some(date => selectedReviewDates.has(date))
    );
  }

  function updateReviewSummary(){
    const pool = reviewPool();
    const availableFavorites = pool.filter(isFavorite).length;
    const requestedTotal = Math.max(1, parseInt(reviewTotalInput.value, 10) || 1);
    const plannedTotal = Math.min(requestedTotal, pool.length);
    const requestedFavorites = Math.max(0, parseInt(reviewFavoriteInput.value, 10) || 0);
    const guaranteedFavorites = Math.min(requestedFavorites, availableFavorites, plannedTotal);
    const notes = [];

    reviewScopeSummary.innerHTML = selectedReviewDates.size
      ? `<strong>${selectedReviewDates.size}일</strong> · 고유 ${pool.length.toLocaleString()}개 · ★ ${availableFavorites.toLocaleString()}개`
      : '날짜를 선택하세요.';

    if (pool.length && requestedTotal > pool.length) notes.push(`총 ${pool.length.toLocaleString()}개 전부 추출`);
    if (requestedFavorites > guaranteedFavorites) notes.push(`즐겨찾기는 최대 ${guaranteedFavorites.toLocaleString()}개 보장`);
    reviewConstraintNote.textContent = notes.join(' · ');
    reviewSubmitBtn.disabled = pool.length === 0;
  }

  function renderReviewDateList({ initialize = false } = {}){
    const entries = dateTagCounts();
    const availableDates = new Set(entries.map(([date]) => date));
    selectedReviewDates = new Set([...selectedReviewDates].filter(date => availableDates.has(date)));

    if (initialize && !reviewSelectionInitialized) {
      const firstDate = activeDateFilter && availableDates.has(activeDateFilter)
        ? activeDateFilter
        : entries[0]?.[0];
      if (firstDate) selectedReviewDates.add(firstDate);
      reviewSelectionInitialized = true;
    }

    reviewDateList.innerHTML = entries.length
      ? entries.map(([date, count]) => `
          <label class="review-date-option">
            <input type="checkbox" data-review-date="${date}"${selectedReviewDates.has(date) ? ' checked' : ''}>
            <span class="review-date-text">${formatDateTag(date)}</span>
            <span class="review-date-count">${count.toLocaleString()}</span>
          </label>`).join('')
      : '<p class="date-filter-empty">아직 추가한 날짜 태그가 없습니다.</p>';
    updateReviewSummary();
  }

  function shuffleArray(items){
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function clearViewFiltersForReview(){
    searchInput.value = '';
    activePos.clear();
    document.querySelectorAll('.pos-chip.active').forEach(chip => chip.classList.remove('active'));
    updatePosToggle();
    favOnly = false;
    favOnlyChip.classList.remove('active');
    activeDateFilter = '';
    updateDateFilterButton();
    filtered = currentSource();
  }

  function defaultStudyDate(now = new Date()){
    const studyDate = new Date(now);
    if (studyDate.getHours() < 4) studyDate.setDate(studyDate.getDate() - 1);
    const year = studyDate.getFullYear();
    const month = String(studyDate.getMonth() + 1).padStart(2, '0');
    const day = String(studyDate.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function openDateTagDialog(key){
    const item = itemByKey(key);
    if (!item) return;
    pendingDateTagKey = key;
    dateTagTarget.textContent = `${itemLabel(item)} · ${item.word}`;
    dateTagInput.value = defaultStudyDate();
    dateTagDialog.showModal();
  }

  function updateCollectionUI(){
    const custom = currentCollection === 'custom';
    builtinSetBtn.classList.toggle('active', !custom);
    builtinSetBtn.setAttribute('aria-selected', custom ? 'false' : 'true');
    customSetBtn.classList.toggle('active', custom);
    customSetBtn.setAttribute('aria-selected', custom ? 'true' : 'false');
    customAddBtn.hidden = !custom;
    jumpForm.hidden = custom;
    searchInput.placeholder = custom
      ? '내 단어 · 뜻 · 예문 검색'
      : '스페인어 · 영어 뜻 · 예문 검색';
    updateFavCount();
  }

  function switchCollection(collection){
    if (currentCollection === collection) return;
    currentCollection = collection;
    searchInput.value = '';
    activePos.clear();
    document.querySelectorAll('.pos-chip.active').forEach(chip => chip.classList.remove('active'));
    favOnly = false;
    favOnlyChip.classList.remove('active');
    activeDateFilter = '';
    overrideList = null;
    updateCollectionUI();
    updatePosToggle();
    updateDateFilterButton();
    applyFilters();
  }

  function openCardEditor(item = null){
    editingCustomCardId = item?.id || null;
    cardEditorTitle.textContent = item ? `${itemLabel(item)} 수정` : '내 단어 추가';
    cardEditorSubmitBtn.textContent = item ? '저장' : '추가';
    customWordInput.value = item?.word || '';
    customMeaningInput.value = item?.en || '';
    customPosInput.value = item?.pos || LEGEND[0]?.abbr || 'n';
    customExampleEsInput.value = item?.ex_es || '';
    customExampleEnInput.value = item?.ex_en || '';
    cardEditorDialog.showModal();
    requestAnimationFrame(() => customWordInput.focus());
  }

  LEGEND.forEach(item => {
    const option = document.createElement('option');
    option.value = item.abbr;
    option.textContent = `${item.abbr} · ${item.kr}`;
    customPosInput.appendChild(option);
  });

  builtinSetBtn.addEventListener('click', () => switchCollection('builtin'));
  customSetBtn.addEventListener('click', () => switchCollection('custom'));
  customAddBtn.addEventListener('click', () => openCardEditor());

  cardEditorForm.addEventListener('submit', event => {
    event.preventDefault();
    if (!cardEditorForm.reportValidity()) return;
    const selectedPos = LEGEND.find(item => item.abbr === customPosInput.value) || LEGEND[0];
    const now = new Date().toISOString();
    let item = editingCustomCardId
      ? customCards.find(card => card.id === editingCustomCardId && !card.deletedAt)
      : null;
    if (item) {
      Object.assign(item, {
        word: customWordInput.value.trim(),
        en: customMeaningInput.value.trim(),
        pos: selectedPos.abbr,
        pos_kr: selectedPos.kr,
        ex_es: customExampleEsInput.value.trim(),
        ex_en: customExampleEnInput.value.trim(),
        updatedAt: now,
      });
    } else {
      const nextSeq = customCards.reduce((max, card) => Math.max(max, card.seq || 0), 0) + 1;
      item = {
        id: crypto.randomUUID(),
        seq: nextSeq,
        custom: true,
        word: customWordInput.value.trim(),
        en: customMeaningInput.value.trim(),
        pos: selectedPos.abbr,
        pos_kr: selectedPos.kr,
        ex_es: customExampleEsInput.value.trim(),
        ex_en: customExampleEnInput.value.trim(),
        favorite: false,
        dates: [],
        createdAt: now,
        updatedAt: now,
        deletedAt: '',
      };
      customCards.push(item);
    }
    saveLocalCustomCards();
    queueCloudSave();
    overrideList = null;
    cardEditorDialog.close();
    applyFilters();
  });

  cardEditorDialog.addEventListener('close', () => {
    editingCustomCardId = null;
    cardEditorForm.reset();
  });

    if (!item) return;
    pendingMemoKey = key;
    memoTarget.textContent = `${itemLabel(item)} · ${item.word}`;
    memoInput.innerHTML = noteHTML(key);

  function closeMemoAfterSave(html){

    const key = pendingMemoKey;
    setCardNote(key, html);
    queueCloudSave();
    const button = document.querySelector(`.memo-btn[data-key="${key}"]`);
    if (button) {

      button.classList.toggle('has-note', hasNote);

    closeMemoAfterSave(memoInput.innerHTML);

  function rememberMemoSelection(){
    const selection = window.getSelection();
    if (!selection.rangeCount || !memoInput.contains(selection.anchorNode) || !memoInput.contains(selection.focusNode)) return;
    savedMemoRange = selection.getRangeAt(0).cloneRange();
  }

  function restoreMemoSelection(){
    memoInput.focus();
    if (!savedMemoRange) return;
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(savedMemoRange);
  }

  document.addEventListener('selectionchange', () => {
    if (!memoDialog.open) return;
    rememberMemoSelection();
    memoFormatBtns.forEach(button => {
      let active = false;
      try {
        active = document.queryCommandState(button.dataset.command);
      } catch {}
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  });

  const memoToolbar = document.querySelector('.memo-toolbar');
  memoToolbar.addEventListener('pointerdown', event => {
    if (event.target.closest('button')) event.preventDefault();
  });
  memoToolbar.addEventListener('mousedown', event => {
    if (event.target.closest('button')) event.preventDefault();
  });

  memoFormatBtns.forEach(button => {
    button.addEventListener('click', () => {
      restoreMemoSelection();
      document.execCommand('styleWithCSS', false, false);
      document.execCommand(button.dataset.command, false);
      rememberMemoSelection();
      button.setAttribute('aria-pressed', document.queryCommandState(button.dataset.command) ? 'true' : 'false');
    });
  });

  memoFontSelect.addEventListener('change', () => {
    const font = MEMO_FONT_VALUES[memoFontSelect.value];
    if (!font) return;
    restoreMemoSelection();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('fontName', false, font);
    document.execCommand('styleWithCSS', false, false);
    rememberMemoSelection();
    memoFontSelect.value = '';
  });

  memoColorBtns.forEach(button => {
    button.addEventListener('click', () => {
      const color = MEMO_COLOR_VALUES[button.dataset.memoColor];
      if (!color) return;
      restoreMemoSelection();
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('foreColor', false, color);
      document.execCommand('styleWithCSS', false, false);
      rememberMemoSelection();
    });
  });

  memoDialog.addEventListener('close', () => {
    pendingMemoKey = null;
    savedMemoRange = null;
    memoTarget.textContent = '';
    memoInput.innerHTML = '';
  });

  // ---- Build POS chip row ----
  function updatePosToggle(){
    const selectedCount = activePos.size;
    const open = !posRow.hidden;
    posToggle.classList.toggle('has-active', selectedCount > 0);
    posToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    const action = open ? '접기' : '펼치기';
    const selected = selectedCount ? ` · ${selectedCount}개 선택됨` : '';
    posToggle.setAttribute('aria-label', `품사 필터 ${action}${selected}`);
    posToggle.title = `품사 필터 ${action}${selected}`;
  }

  posToggle.addEventListener('click', () => {
    posRow.hidden = !posRow.hidden;
    updatePosToggle();
  });

  LEGEND.forEach(l => {
    const chip = document.createElement('div');
    chip.className = 'pos-chip';
    chip.dataset.pos = l.abbr;
    chip.innerHTML = `${l.abbr} <span class="kr-inline">${l.kr}</span> <span class="count">${l.count}</span>`;
    chip.addEventListener('click', () => {
      if (activePos.has(l.abbr)) { activePos.delete(l.abbr); chip.classList.remove('active'); }
      else { activePos.add(l.abbr); chip.classList.add('active'); }
      updatePosToggle();
      overrideList = null;
      applyFilters();
    });
    posRow.appendChild(chip);
  });

  // ---- Build legend table ----
  LEGEND.forEach(l => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="abbr">${l.abbr}</td><td class="kr">${l.kr}</td><td>${l.en}</td><td>${l.count}</td>`;
    legendBody.appendChild(tr);
  });

  legendToggle.addEventListener('click', () => {
    const open = legendWrap.classList.toggle('open');
    legendToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  function setControlsOpen(open){
    controlsWrap.classList.toggle('is-collapsed', !open);
    controlsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    controlsToggle.setAttribute('aria-label', open ? '검색, 필터 및 동기화 닫기' : '검색, 필터 및 동기화 열기');
  }

  controlsToggle.addEventListener('click', () => {
    controlsWrap.classList.remove('mobile-hidden');
    setControlsOpen(controlsWrap.classList.contains('is-collapsed'));
  });

  const mobileControlsQuery = window.matchMedia('(max-width: 640px)');
  let lastScrollY = window.scrollY;
  let scrollTicking = false;
  window.addEventListener('scroll', () => {
    if (!mobileControlsQuery.matches || scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
      const currentY = window.scrollY;
      const delta = currentY - lastScrollY;
      if (currentY <= 12) {
        controlsWrap.classList.remove('mobile-hidden');
      } else if (delta > 5) {
        setControlsOpen(false);
        controlsWrap.classList.add('mobile-hidden');
      } else if (delta < -3) {
        controlsWrap.classList.remove('mobile-hidden');
      }
      lastScrollY = currentY;
      scrollTicking = false;
    });
  }, { passive: true });

  document.querySelectorAll('[data-dialog-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.dialogClose)?.close();
    });
  });

  dateFilterBtn.addEventListener('click', () => {
    renderDateFilterList();
    dateFilterDialog.showModal();
  });

  dateFilterList.addEventListener('click', (event) => {
    const option = event.target.closest('[data-filter-date]');
    if (!option) return;
    activeDateFilter = option.dataset.filterDate || '';
    updateDateFilterButton();
    overrideList = null;
    dateFilterDialog.close();
    if (mobileControlsQuery.matches) setControlsOpen(false);
    applyFilters();
  });

  reviewBtn.addEventListener('click', () => {
    renderReviewDateList({ initialize: true });
    reviewDialog.showModal();
  });

  reviewDateList.addEventListener('change', (event) => {
    const checkbox = event.target.closest('[data-review-date]');
    if (!checkbox) return;
    if (checkbox.checked) selectedReviewDates.add(checkbox.dataset.reviewDate);
    else selectedReviewDates.delete(checkbox.dataset.reviewDate);
    updateReviewSummary();
  });

  reviewSelectAllBtn.addEventListener('click', () => {
    selectedReviewDates = new Set(dateTagCounts().map(([date]) => date));
    renderReviewDateList();
  });

  reviewClearBtn.addEventListener('click', () => {
    selectedReviewDates.clear();
    renderReviewDateList();
  });

  reviewTotalInput.addEventListener('input', updateReviewSummary);
  reviewFavoriteInput.addEventListener('input', updateReviewSummary);

  reviewForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const pool = reviewPool();
    if (!pool.length) return;

    const requestedTotal = Math.max(1, parseInt(reviewTotalInput.value, 10) || 1);
    const total = Math.min(requestedTotal, pool.length);
    const requestedFavorites = Math.max(0, parseInt(reviewFavoriteInput.value, 10) || 0);
    const favoritePool = pool.filter(isFavorite);
    const guaranteedCount = Math.min(requestedFavorites, favoritePool.length, total);
    const guaranteed = shuffleArray(favoritePool).slice(0, guaranteedCount);
    const guaranteedKeys = new Set(guaranteed.map(itemKey));
    const remainder = pool.filter(item => !guaranteedKeys.has(itemKey(item)));
    const selected = guaranteed.concat(shuffleArray(remainder).slice(0, total - guaranteed.length));

    reviewTotalInput.value = String(total);
    reviewFavoriteInput.value = String(Math.min(requestedFavorites, total));
    clearViewFiltersForReview();
    overrideList = shuffleArray(selected);
    resetGrid();
    reviewDialog.close();
    if (mobileControlsQuery.matches) setControlsOpen(false);
    requestAnimationFrame(() => {
      document.querySelector('main').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  dateTagSaveBtn.addEventListener('click', () => {
    if (!dateTagInput.reportValidity() || pendingDateTagKey === null) return;
    const date = dateTagInput.value;
    if (!isValidDateTag(date)) return;
    const item = itemByKey(pendingDateTagKey);
    if (!item) return;
    const tags = new Set(itemDates(item));
    tags.add(date);
    if (item.custom) {
      item.dates = [...tags].sort();
      touchCustomCard(item);
    } else {
      dateTags[item.rank] = [...tags].sort();
      saveLocalDateTags();
    }
    const row = document.querySelector(`[data-date-tags-key="${pendingDateTagKey}"]`);
    if (row) row.innerHTML = cardDateTagsInnerHTML(item);
    renderDateFilterList();
    queueCloudSave();
    dateTagDialog.close();
    pendingDateTagKey = null;
  });

  dateTagDialog.addEventListener('close', () => {
    pendingDateTagKey = null;
    dateTagInput.value = '';
  });

  // ---- Card rendering ----
  function cardHTML(d){
    const key = itemKey(d);
    const label = itemLabel(d);
    const customActions = d.custom ? `
      <span class="custom-card-actions">
        <button type="button" class="custom-card-action custom-edit-btn" data-id="${d.id}" aria-label="${label} 수정" title="수정">✎</button>
        <button type="button" class="custom-card-action custom-delete-btn" data-id="${d.id}" aria-label="${label} 삭제" title="삭제">×</button>
      </span>` : '';
    const exampleBlock = d.ex_es || d.ex_en ? `
        <hr class="divider">
        ${d.ex_es ? `<p class="example-es">${escapeHTML(d.ex_es)}</p>` : ''}
        ${d.ex_en ? `<p class="example-en${hideMeaning ? ' hidden-mode' : ''}">${escapeHTML(d.ex_en)}</p>` : ''}` : '';
    const hasNote = hasCardNote(key);
    const memoLabel = `${label} 메모${hasNote ? ' 있음' : ''}`;
    return `
      <article class="card" id="card-${d.custom ? `custom-${d.id}` : d.rank}">
        <div class="card-top">
          <span class="rank-group">
            <span class="rank-tab">${label}</span>
            <button type="button" class="star-btn${isFavorite(d) ? ' active' : ''}" data-key="${key}" aria-label="즐겨찾기"></button>
          </span>
          <span class="pos-tag">${d.pos}<span class="kr">${d.pos_kr}</span></span>
        </div>
        <h2 class="headword">${escapeHTML(d.word)}</h2>
        <p class="meaning${hideMeaning ? ' hidden-mode' : ''}">${escapeHTML(d.en)}</p>
        ${exampleBlock}
        <div class="card-date-tags" data-date-tags-key="${key}">${cardDateTagsInnerHTML(d)}</div>
        <div class="card-foot">
          <span class="card-tools">${customActions}<button type="button" class="memo-btn${hasNote ? ' has-note' : ''}" data-key="${key}" aria-label="${memoLabel}" title="${hasNote ? '메모 열기 · 내용 있음' : '메모 열기'}"><span class="memo-dot" aria-hidden="true"></span>메모</button></span>
          <span class="page-ref">${d.custom ? 'my set' : `p. ${d.page}`}</span>
        </div>
      </article>`;
  }

  function escapeHTML(s){
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderNextChunk(){
    const source = overrideList || filtered;
    const slice = source.slice(renderedCount, renderedCount + CHUNK);
    if (slice.length === 0) return;
    const html = slice.map(cardHTML).join('');
    grid.insertAdjacentHTML('beforeend', html);
    renderedCount += slice.length;
  }

  function resetGrid(){
    grid.innerHTML = '';
    renderedCount = 0;
    const source = overrideList || filtered;
    if (source.length === 0){
      const message = currentCollection === 'custom' && visibleCustomCards().length === 0
        ? '아직 추가한 단어가 없습니다. 위의 + 단어 추가로 첫 카드를 만들어 보세요.'
        : '일치하는 단어가 없습니다. 검색어나 필터를 확인해 보세요.';
      grid.innerHTML = `<div class="empty-state">${message}</div>`;
      resultCount.innerHTML = `<b>0</b> / ${currentSource().length.toLocaleString()}`;
      return;
    }
    renderNextChunk();
    resultCount.innerHTML = overrideList
      ? `복습 <b>${overrideList.length}</b>개 · ★ ${overrideList.filter(isFavorite).length}`
      : `<b>${filtered.length.toLocaleString()}</b> / ${currentSource().length.toLocaleString()}`;
  }

  function applyFilters(){
    const q = searchInput.value.trim().toLowerCase();
    filtered = currentSource().filter(d => {
      if (favOnly && !isFavorite(d)) return false;
      if (activeDateFilter && !itemDates(d).includes(activeDateFilter)) return false;
      if (activePos.size > 0 && !activePos.has(d.pos)) return false;
      if (!q) return true;
      return (
        d.word.toLowerCase().includes(q) ||
        d.en.toLowerCase().includes(q) ||
        d.ex_es.toLowerCase().includes(q) ||
        d.ex_en.toLowerCase().includes(q)
      );
    });
    resetGrid();
  }

  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { overrideList = null; applyFilters(); }, 180);
  });

  jumpForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const n = parseInt(jumpInput.value, 10);
    if (!n || n < 1 || n > 2500) return;
    // clear filters so target rank is guaranteed visible
    searchInput.value = '';
    activePos.clear();
    document.querySelectorAll('.pos-chip.active').forEach(c => c.classList.remove('active'));
    updatePosToggle();
    favOnly = false;
    favOnlyChip.classList.remove('active');
    activeDateFilter = '';
    updateDateFilterButton();
    overrideList = null;
    filtered = DATA;
    grid.innerHTML = '';
    renderedCount = 0;
    const neededChunks = Math.ceil(n / CHUNK);
    for (let i = 0; i < neededChunks; i++) renderNextChunk();
    resultCount.innerHTML = `<b>${filtered.length.toLocaleString()}</b> / 2,500`;
    requestAnimationFrame(() => {
      const el = document.getElementById('card-' + n);
      if (el){
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1200);
      }
    });
  });

  hideToggle.addEventListener('click', () => {
    hideMeaning = !hideMeaning;
    hideToggle.setAttribute('aria-pressed', hideMeaning ? 'true' : 'false');
    hideToggle.textContent = hideMeaning ? '해석 보기' : '해석 숨기기';
    grid.classList.toggle('translation-test-mode', hideMeaning);
    document.querySelectorAll('.card.translation-visible').forEach(card => card.classList.remove('translation-visible'));
    document.querySelectorAll('.meaning, .example-en').forEach(el => el.classList.toggle('hidden-mode', hideMeaning));
  });

  favOnlyChip.addEventListener('click', () => {
    favOnly = !favOnly;
    favOnlyChip.classList.toggle('active', favOnly);
    overrideList = null;
    applyFilters();
  });

  grid.addEventListener('click', (e) => {
    const memoBtn = e.target.closest('.memo-btn');
    if (memoBtn){
      openMemoDialog(memoBtn.dataset.key);
      return;
    }

    const editBtn = e.target.closest('.custom-edit-btn');
    if (editBtn){
      const item = customCards.find(card => card.id === editBtn.dataset.id && !card.deletedAt);
      if (item) openCardEditor(item);
      return;
    }

    const deleteBtn = e.target.closest('.custom-delete-btn');
    if (deleteBtn){
      const item = customCards.find(card => card.id === deleteBtn.dataset.id && !card.deletedAt);
      if (!item || !confirm(`“${item.word}” 카드를 삭제할까요?`)) return;
      item.deletedAt = new Date().toISOString();
      item.updatedAt = item.deletedAt;
      setCardNote(itemKey(item), '');
      saveLocalCustomCards();
      queueCloudSave();
      overrideList = overrideList?.filter(card => itemKey(card) !== itemKey(item)) || null;
      applyFilters();
      return;
    }

    const addDateBtn = e.target.closest('.date-tag-add');
    if (addDateBtn){
      openDateTagDialog(addDateBtn.dataset.key);
      return;
    }

    const removeDateBtn = e.target.closest('.date-tag-remove');
    if (removeDateBtn){
      const item = itemByKey(removeDateBtn.dataset.key);
      if (!item) return;
      const date = removeDateBtn.dataset.date;
      const nextDates = itemDates(item).filter(itemDate => itemDate !== date);
      if (item.custom) {
        item.dates = nextDates;
        touchCustomCard(item);
      } else {
        if (nextDates.length) dateTags[item.rank] = nextDates;
        else delete dateTags[item.rank];
        saveLocalDateTags();
      }
      queueCloudSave();
      renderDateFilterList();
      if (activeDateFilter === date) {
        const dateStillExists = currentSource().some(card => itemDates(card).includes(date));
        if (!dateStillExists) {
          activeDateFilter = '';
          updateDateFilterButton();
        }
        applyFilters();
      }
      else {
        const row = document.querySelector(`[data-date-tags-key="${itemKey(item)}"]`);
        if (row) row.innerHTML = cardDateTagsInnerHTML(item);
      }
      return;
    }

    const starBtn = e.target.closest('.star-btn');
    if (starBtn){
      const item = itemByKey(starBtn.dataset.key);
      if (!item) return;
      if (item.custom) {
        item.favorite = !item.favorite;
        touchCustomCard(item);
      } else if (favorites.has(item.rank)) {
        favorites.delete(item.rank);
      } else {
        favorites.add(item.rank);
      }
      starBtn.classList.toggle('active', isFavorite(item));
      updateFavCount();
      queueCloudSave();
      if (overrideList) {
        resultCount.innerHTML = `복습 <b>${overrideList.length}</b>개 · ★ ${overrideList.filter(isFavorite).length}`;
      }
      if (favOnly) applyFilters(); // re-filter live if viewing favorites only
      return;
    }

    if (!hideMeaning || e.target.closest('button, input, .card-date-tags')) return;
    const card = e.target.closest('.card');
    if (card) card.classList.toggle('translation-visible');
  });

  favExportBtn.addEventListener('click', async () => {
    if (favorites.size === 0){
      alert('즐겨찾기한 단어가 없습니다.');
      return;
    }
    const ranks = Array.from(favorites).sort((a,b) => a-b).join(',');
    try {
      await navigator.clipboard.writeText(ranks);
      alert(`즐겨찾기 ${favorites.size}개의 순위 번호가 클립보드에 복사되었습니다.\n\n클라우드에도 자동 저장되며, 필요하면 아래 번호로 수동 복원할 수 있습니다.\n\n${ranks}`);
    } catch (err) {
      prompt('클립보드 복사가 지원되지 않습니다. 아래 번호를 직접 복사해 저장하세요:', ranks);
    }
  });

  favImportBtn.addEventListener('click', () => {
    const input = prompt('저장해 둔 즐겨찾기 순위 번호를 붙여넣으세요 (쉼표로 구분, 예: 3,17,42):');
    if (input === null) return;
    const nums = input.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n >= 1 && n <= 2500);
    if (nums.length === 0){
      alert('올바른 순위 번호를 찾지 못했습니다.');
      return;
    }
    favorites = new Set(nums);
    updateFavCount();
    queueCloudSave();
    overrideList = null;
    applyFilters();
    alert(`${nums.length}개의 즐겨찾기를 복원했습니다.`);
  });

  cloudLoadBtn.addEventListener('click', () => {
    loadCloudState({ manual: true });
  });

  cloudSaveBtn.addEventListener('click', () => {
    clearTimeout(saveTimer);
    saveCloudState({ manual: true });
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) renderNextChunk();
    });
  }, { rootMargin: '400px' });
  io.observe(sentinel);

  await loadCloudState();
  updateCollectionUI();
  updateFavCount();
  updateDateFilterButton();
  updatePosToggle();
  resetGrid();
})();
</script>
</body>
</html>
