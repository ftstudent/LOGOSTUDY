<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOGOSTUDY</title>
  <meta name="theme-color" content="#0d0f17">
  <meta name="apple-mobile-web-app-title" content="LOGO.STUDY">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="app-icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #0d0f17;
      --panel: #171a26;
      --panel2: #202433;
      --line: rgba(255,255,255,.08);
      --text: #f7f2ea;
      --muted: #a8adbb;
      --accent: #7c8cff;
      --accent2: #46c2a8;
      --good: #67d083;
      --warn: #f4b860;
      --bad: #f17474;
      --xp: #f6c66b;
      --shadow: 0 18px 50px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 0%, rgba(124,140,255,.20), transparent 34%),
        radial-gradient(circle at 92% 8%, rgba(70,194,168,.14), transparent 30%),
        linear-gradient(180deg, #101420 0%, var(--bg) 42%, #0b0d13 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px;
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 9px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .brand:focus-visible {
      outline: 3px solid rgba(70,194,168,.45);
      outline-offset: 6px;
      border-radius: 16px;
    }

    .loop-mark {
      display: grid;
      grid-template-columns: repeat(2, 9px);
      grid-template-rows: repeat(2, 9px);
      gap: 5px;
      padding: 9px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(70,194,168,.16), rgba(246,198,107,.13));
      box-shadow: inset 0 0 18px rgba(255,255,255,.035), 0 10px 26px rgba(0,0,0,.20);
    }

    .loop-mark span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent2);
    }

    .loop-mark span:nth-child(2) { background: var(--xp); }
    .loop-mark span:nth-child(3) { background: var(--accent); }
    .loop-mark span:nth-child(4) { background: #ff8aa8; }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 3px;
      margin: 0;
      line-height: 1;
      font-size: 31px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .wordmark .logo-part {
      color: var(--text);
    }

    .wordmark .study-part {
      color: var(--accent2);
    }

    .wordmark .dot {
      color: var(--xp);
      padding: 0 1px;
    }

    .subtitle {
      color: #c2c6d2;
      font-size: 14px;
    }

    .level-box {
      min-width: 250px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(246,198,107,.16), rgba(124,140,255,.12)), var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .level-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .level-name { color: var(--xp); font-weight: 800; }
    .xp-text { color: #cfd3df; }
    .level-total {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: #b7bdcb;
      font-size: 12px;
    }
    .meter, .progress {
      height: 9px;
      background: rgba(0,0,0,.28);
      border-radius: 999px;
      overflow: hidden;
    }
    .meter > div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--xp), #ff8aa8);
      transition: width .25s;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,.035), transparent), var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 14px 36px rgba(0,0,0,.22);
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 16px;
      font-weight: 800;
    }

    .hint {
      color: #b7bdcb;
      font-size: 12px;
      font-weight: 400;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    .form.two, .form.task { grid-template-columns: 1fr; align-items: stretch; }

    .inline-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 6px;
      color: #b7bdcb;
      font-size: 12px;
    }

    input, select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      background: rgba(7,9,14,.72);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: rgba(124,140,255,.85);
      box-shadow: 0 0 0 3px rgba(124,140,255,.16);
    }

    .date-control {
      position: relative;
      display: grid;
    }

    .date-control input {
      padding-right: 44px;
    }

    .date-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      width: 32px;
      height: 32px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      color: var(--text);
      cursor: pointer;
      font-size: 15px;
    }

    .date-picker {
      position: absolute;
      z-index: 10;
      top: calc(100% + 8px);
      left: 0;
      width: min(300px, calc(100vw - 56px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #202433;
      box-shadow: var(--shadow);
    }

    .date-picker[hidden] {
      display: none;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .calendar-head button,
    .calendar-day {
      border: 0;
      border-radius: 9px;
      background: rgba(255,255,255,.07);
      color: var(--text);
      cursor: pointer;
    }

    .calendar-head button {
      width: 30px;
      height: 30px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-weekday {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      padding: 4px 0;
    }

    .calendar-day {
      min-height: 32px;
      font-size: 12px;
    }

    .calendar-day:hover,
    .calendar-day.selected {
      background: var(--accent);
    }

    .calendar-day.muted {
      opacity: .35;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #6f6de8);
      white-space: nowrap;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(80,92,190,.22);
    }

    .btn.secondary {
      background: rgba(255,255,255,.07);
      color: var(--text);
      box-shadow: none;
    }
    .btn.good {
      background: rgba(103,208,131,.16);
      color: var(--good);
      box-shadow: none;
    }
    .btn.bad {
      background: rgba(241,116,116,.14);
      color: var(--bad);
      box-shadow: none;
    }
    .btn.small { padding: 8px 10px; font-size: 12px; }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); }

    .timer {
      display: grid;
      gap: 13px;
      background: linear-gradient(135deg, rgba(70,194,168,.09), rgba(124,140,255,.08)), var(--panel);
    }

    .today-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .daily-card {
      min-height: 76px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)), var(--panel);
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
    }

    .daily-card strong {
      display: block;
      color: var(--xp);
      font-size: 24px;
      line-height: 1;
      font-weight: 900;
    }

    .daily-card span {
      display: block;
      margin-top: 8px;
      color: #aeb5c5;
      font-size: 12px;
      font-weight: 700;
    }

    .timer-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .shift-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .clock {
      font-size: 46px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .clock.ok { color: var(--good); }
    .clock.warn { color: var(--warn); }
    .clock.bad { color: var(--bad); }

    .timer-note {
      color: #b7bdcb;
      font-size: 13px;
    }

    .progress > div {
      width: 0;
      height: 100%;
      background: var(--good);
      transition: width .2s, background .2s;
    }

    .section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.07);
    }
    .section:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

    .section-title {
      margin-bottom: 10px;
      color: #aeb5c5;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .list { display: grid; gap: 10px; }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 11px;
      align-items: center;
      padding: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.035), transparent), var(--panel2);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .item.overdue { border-color: rgba(241,116,116,.55); }

    .tag {
      min-width: 64px;
      text-align: center;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(124,140,255,.17);
      color: #c9d1ff;
    }

    .tag.spanish { background: rgba(255,138,168,.16); color: #ffc4d3; }
    .tag.task { background: rgba(70,194,168,.16); color: #bdf1e5; }

    .item-main { min-width: 0; }
    .item-title { font-weight: 800; overflow-wrap: anywhere; }
    .item-sub { margin-top: 4px; color: #aeb5c5; font-size: 12px; }

    .report-row {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .completion-control {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) 44px;
      gap: 8px;
      align-items: center;
      min-width: 190px;
    }

    .completion-control input[type="range"] {
      width: 100%;
      accent-color: var(--accent2);
      cursor: pointer;
    }

    .completion-value {
      color: var(--xp);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .dots { display: flex; gap: 5px; margin-top: 8px; }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,.17);
    }
    .dot.done { background: var(--good); }
    .dot.next { box-shadow: 0 0 0 2px var(--warn) inset; }

    .empty { padding: 18px 4px; color: #aeb5c5; font-size: 13px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: linear-gradient(135deg, rgba(246,198,107,.12), rgba(124,140,255,.08)), var(--panel2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }

    .stat-num { font-size: 23px; font-weight: 900; color: var(--xp); }
    .stat-label { color: #aeb5c5; font-size: 12px; margin-top: 3px; }

    .bars {
      height: 120px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      align-items: end;
    }

    .bar-col {
      display: grid;
      gap: 5px;
      align-items: end;
      text-align: center;
      color: #aeb5c5;
      font-size: 11px;
    }

    .bar {
      min-height: 3px;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(18px);
      padding: 12px 16px;
      border-radius: 14px;
      background: #f7f2ea;
      color: #111318;
      opacity: 0;
      pointer-events: none;
      transition: .18s;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    [hidden] { display: none !important; }

    .auth-panel {
      width: min(440px, calc(100% - 32px));
      margin: 12vh auto 0;
      background: linear-gradient(180deg, rgba(255,255,255,.045), transparent), var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .auth-panel h1 {
      font-size: 28px;
    }

    .auth-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 18px;
      align-items: end;
    }

    .sync-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: #cbd1df;
      font-size: 12px;
      font-weight: 700;
      box-shadow: none;
      cursor: default;
    }

    .app-footer {
      display: flex;
      justify-content: flex-end;
      padding: 2px 0 10px;
    }

    @media (max-width: 760px) {
      .app { padding: 16px; }
      .top, .grid, .form.two, .form.task { grid-template-columns: 1fr; }
      .level-box { min-width: 0; }
      .wordmark { font-size: 27px; }
      .today-summary { grid-template-columns: 1fr; }
      .item { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .auth-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="top">
      <div>
        <button class="brand" id="brandRefresh" type="button" aria-label="LOGOSTUDY 새로고침">
          <div class="loop-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <h1 class="wordmark">
            <span class="logo-part">LOGO</span><span class="dot">.</span><span class="study-part">STUDY</span>
          </h1>
        </button>
      </div>
      <div class="level-box">
        <div class="level-row">
          <span class="level-name" id="levelName">Lv.1 수험생</span>
          <span class="xp-text" id="xpText">0 XP</span>
        </div>
        <div class="meter"><div id="xpFill"></div></div>
        <div class="level-total">
          <span id="levelRange">0 / 100 XP</span>
          <span id="nextXp">다음 레벨까지 100 XP</span>
        </div>
      </div>
    </header>

    <section class="grid">
      <div>
        <section class="today-summary" aria-label="오늘 학습 요약">
          <div class="daily-card">
            <strong id="todayXpCard">+0</strong>
            <span>오늘 XP</span>
          </div>
          <div class="daily-card">
            <strong id="todayTodoCard">0</strong>
            <span>오늘 할 일</span>
          </div>
          <div class="daily-card">
            <strong id="streakCard">0</strong>
            <span>연속 학습일</span>
          </div>
        </section>

        <section class="panel timer">
          <div class="panel-title">
            <span>복습 타이머</span>
            <span class="hint">시간 안에 오늘 복습을 끝내면 +7 XP</span>
          </div>
          <div class="timer-row">
            <button class="btn secondary small" data-timer="5">5분</button>
            <button class="btn secondary small" data-timer="10">10분</button>
            <button class="btn secondary small" data-timer="15">15분</button>
            <button class="btn secondary small" data-timer="20">20분</button>
            <input id="customMinutes" type="number" min="1" max="99" placeholder="직접 입력" style="width:120px">
            <button class="btn small" id="customTimerBtn">시작</button>
            <button class="btn secondary small" id="stopTimerBtn">중단</button>
          </div>
          <div class="clock ok" id="clock">00:00</div>
          <div class="progress"><div id="timerBar"></div></div>
          <div class="timer-note" id="timerNote">타이머를 켜고 복습을 시작하세요.</div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>복습 일정 조정</span>
            <span class="hint">남은 어휘 복습 전체를 뒤로 미룹니다</span>
          </div>
          <div class="shift-row">
            <select id="reviewShiftDays">
              <option value="1">1일 미루기</option>
              <option value="2">2일 미루기</option>
              <option value="3">3일 미루기</option>
              <option value="7">7일 미루기</option>
            </select>
            <button class="btn secondary small" id="shiftReviewsBtn" type="button">전체 일정 밀기</button>
          </div>
          <div class="hint" id="shiftSummary" style="margin-top:10px">진행 중인 어휘 배치에만 적용됩니다.</div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>오늘 할 일</span>
            <span class="hint" id="todayCount">0개</span>
          </div>
          <div class="section">
            <div class="section-title">밀린 복습</div>
            <div class="list" id="overdueList"></div>
          </div>
          <div class="section">
            <div class="section-title">오늘 복습</div>
            <div class="list" id="dueList"></div>
          </div>
          <div class="section">
            <div class="section-title">오늘 과제</div>
            <div class="list" id="taskList"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">어휘 배치</div>
          <div class="list" id="batchList"></div>
        </section>
      </div>

      <aside>
        <section class="panel">
          <div class="panel-title">새 어휘 배치</div>
          <form class="form two" id="vocabForm">
            <label>과목
              <select id="vocabSubject">
                <option value="english">영어</option>
                <option value="spanish">스페인어</option>
              </select>
            </label>
            <label>배치 이름
              <input id="vocabName" required placeholder="예: TEPS 숙어 12">
            </label>
            <label>학습일
              <span class="date-control">
                <input id="vocabLearnedAt" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="off">
                <button class="date-toggle" type="button" id="vocabDateToggle" aria-label="학습일 달력 열기">▾</button>
                <span class="date-picker" id="vocabDatePicker" hidden></span>
              </span>
            </label>
            <label>다음 복습
              <select id="vocabNextReview">
                <option value="none">아직 학습 전</option>
                <option value="1">+1일 복습부터</option>
                <option value="3">+3일 복습부터</option>
                <option value="7">+7일 복습부터</option>
                <option value="14">+14일 복습부터</option>
              </select>
            </label>
            <button class="btn" type="submit">등록</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-title">임시 과제</div>
          <form class="form task" id="taskForm">
            <label>분야
              <select id="taskSubject">
              </select>
            </label>
            <label>새 분야
              <span class="inline-field">
                <input id="newTaskSubject" placeholder="예: 영어, 스페인어, 논술">
                <button class="btn secondary small" id="addTaskSubjectBtn" type="button">추가</button>
              </span>
            </label>
            <label>내용
              <input id="taskName" required placeholder="예: 10쪽 읽고 발제 메모">
            </label>
            <label>난이도
              <select id="taskDifficulty">
                <option value="light">가벼움</option>
                <option value="normal" selected>보통</option>
                <option value="hard">어려움</option>
                <option value="deep">깊게 파기</option>
              </select>
            </label>
            <button class="btn" type="submit">추가</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-title">통계</div>
          <div class="stats">
            <div class="stat">
              <div class="stat-num" id="statXp">0</div>
              <div class="stat-label">총 XP</div>
            </div>
            <div class="stat">
              <div class="stat-num" id="statTodayXp">0</div>
              <div class="stat-label">오늘 XP</div>
            </div>
            <div class="stat">
              <div class="stat-num" id="statAvgXp">0</div>
              <div class="stat-label">7일 평균</div>
            </div>
            <div class="stat">
              <div class="stat-num" id="statStreak">0</div>
              <div class="stat-label">연속 학습일</div>
            </div>
            <div class="stat">
              <div class="stat-num" id="statMastered">0</div>
              <div class="stat-label">완전 암기</div>
            </div>
          </div>
          <div class="section-title">최근 7일 XP</div>
          <div class="bars" id="xpBars"></div>
        </section>

      </aside>
    </section>
    <footer class="app-footer">
      <button class="sync-button" id="syncStatus" type="button">클라우드 연결 중</button>
    </footer>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://peblghbzugqajklsuoip.supabase.co";
    const SUPABASE_KEY = "sb_publishable_J8n4rbxSZAG755BMSnPrlQ_4LgqhwpC";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function initApp() {
      if (window.studyLoopReady) return;
      window.studyLoopReady = true;
      const KEY = 'study-loop-v1';
      const INTERVALS = [1, 3, 7, 14];
      const LEVELS = [
        ['수험생', 0],
        ['탐구자', 100],
        ['독서가', 250],
        ['분석가', 450],
        ['연구자', 700],
        ['학자', 1000],
        ['석학', 1400],
        ['교수', 1850],
        ['권위자', 2400],
        ['대가', 3000],
      ];
      const XP = {
        initialStudy: 10,
        review: { 1: 5, 3: 8, 7: 10, 14: 15 },
        taskBase: { light: 15, normal: 30, hard: 45, deep: 65 },
        taskPerfectBonus: { light: 5, normal: 10, hard: 15, deep: 20 },
        timerBonus: 7,
      };
      const DEFAULT_TASK_SUBJECTS = ['전공서적', '서양사', '영어', '스페인어', '기타'];

      const $ = id => document.getElementById(id);
      let toastTimer = null;
      let timerId = null;
      let timer = { state: 'idle', total: 0, remaining: 0, bonus: false };
      let state = freshData();
      let persistTimer = null;
      let renderedStudyDay = null;

      function freshData() {
        return { xp: 0, streak: 0, lastActive: null, xpLog: [], batches: [], tasks: [], taskSubjects: [...DEFAULT_TASK_SUBJECTS] };
      }

      function localData() {
        try {
          const raw = localStorage.getItem(KEY);
          if (!raw) return freshData();
          return normalize({ ...freshData(), ...JSON.parse(raw) });
        } catch {
          return freshData();
        }
      }

      function load() {
        return normalize(JSON.parse(JSON.stringify(state)));
      }

      function normalize(data) {
        const taskSubjects = Array.isArray(data.taskSubjects) ? data.taskSubjects : DEFAULT_TASK_SUBJECTS;
        data.batches = data.batches.map(batch => ({
          ...batch,
          registeredAt: batch.registeredAt || batch.created || today(),
          learnedAt: batch.learnedAt || batch.learned || null,
          delayDays: Number(batch.delayDays) || 0,
          done: Array.isArray(batch.done) ? batch.done.map(Number).filter(interval => INTERVALS.includes(interval)) : [],
        }));
        data.tasks = data.tasks.map(task => ({
          ...task,
          difficulty: task.difficulty || 'normal',
          completion: Number(task.completion) || 0,
          xpAwarded: Number(task.xpAwarded) || 0,
          done: Boolean(task.done),
        }));
        data.taskSubjects = [...new Set([...DEFAULT_TASK_SUBJECTS, ...taskSubjects, ...data.tasks.map(task => task.subject)].filter(Boolean))];
        return data;
      }

      async function persistNow() {
        $('syncStatus').textContent = '클라우드 저장 중...';
        const { error } = await supabase
          .from('study_public_state')
          .update({
            data: state,
            updated_at: new Date().toISOString(),
          })
          .eq('id', 'default');
        if (error) {
          console.error(error);
          $('syncStatus').textContent = `클라우드 저장 실패: ${error.message}`;
          toast('클라우드 저장 실패. 화면의 동기화 상태를 확인하세요.');
          return false;
        }
        $('syncStatus').textContent = `클라우드 저장 완료 · ${new Date().toLocaleTimeString('ko-KR')}`;
        return true;
      }

      function save(data) {
        state = normalize(data);
        localStorage.setItem(KEY, JSON.stringify(data));
        clearTimeout(persistTimer);
        persistTimer = setTimeout(persistNow, 250);
      }

      async function loadCloudState() {
        const { data, error } = await supabase
          .from('study_public_state')
          .select('data,updated_at')
          .eq('id', 'default')
          .maybeSingle();

        if (error) {
          console.error(error);
          $('syncStatus').textContent = `클라우드 불러오기 실패: ${error.message}`;
          toast('Supabase SQL 설정을 먼저 실행해야 합니다.');
          return false;
        }

        if (data && data.data) {
          state = normalize({ ...freshData(), ...data.data });
        } else {
          state = localData();
          await persistNow();
        }

        localStorage.setItem(KEY, JSON.stringify(state));
        $('syncStatus').textContent = data && data.updated_at
          ? `동기화 완료 · ${new Date(data.updated_at).toLocaleTimeString('ko-KR')}`
          : '동기화 완료';
        return true;
      }

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function today() {
        const d = new Date();
        d.setHours(d.getHours() - 3);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }

      function addDays(date, days) {
        const d = new Date(date + 'T00:00:00');
        d.setDate(d.getDate() + days);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }

      function dayDiff(a, b) {
        return Math.floor((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
      }

      function fmtDate(date) {
        const d = new Date(date + 'T00:00:00');
        return `${d.getMonth() + 1}/${d.getDate()}`;
      }

      function parseIsoDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return null;
        const d = new Date(value + 'T00:00:00');
        return Number.isNaN(d.getTime()) ? null : d;
      }

      let calendarMonth = parseIsoDate(today());

      function renderCalendar() {
        const picker = $('vocabDatePicker');
        const selected = $('vocabLearnedAt').value;
        const year = calendarMonth.getFullYear();
        const month = calendarMonth.getMonth();
        const first = new Date(year, month, 1);
        const start = new Date(first);
        start.setDate(1 - first.getDay());
        const days = Array.from({ length: 42 }, (_, index) => {
          const d = new Date(start);
          d.setDate(start.getDate() + index);
          const iso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          const cls = [
            'calendar-day',
            d.getMonth() === month ? '' : 'muted',
            iso === selected ? 'selected' : '',
          ].filter(Boolean).join(' ');
          return `<button class="${cls}" type="button" data-date="${iso}">${d.getDate()}</button>`;
        }).join('');
        picker.innerHTML = `
          <div class="calendar-head">
            <button type="button" data-calendar-prev aria-label="이전 달">‹</button>
            <span>${year}년 ${month + 1}월</span>
            <button type="button" data-calendar-next aria-label="다음 달">›</button>
          </div>
          <div class="calendar-grid">
            ${['일','월','화','수','목','금','토'].map(day => `<div class="calendar-weekday">${day}</div>`).join('')}
            ${days}
          </div>`;
      }

      function openCalendar() {
        calendarMonth = parseIsoDate($('vocabLearnedAt').value) || parseIsoDate(today());
        renderCalendar();
        $('vocabDatePicker').hidden = false;
      }

      function closeCalendar() {
        $('vocabDatePicker').hidden = true;
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function esc(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function toast(message) {
        $('toast').textContent = message;
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
      }

      function levelIndex(xp) {
        let idx = 0;
        for (let i = 0; i < LEVELS.length; i += 1) {
          if (xp >= LEVELS[i][1]) idx = i;
        }
        return idx;
      }

      function touchStreak(data) {
        const t = today();
        if (data.lastActive === t) return;
        data.streak = data.lastActive === addDays(t, -1) ? data.streak + 1 : 1;
        data.lastActive = t;
      }

      function addXp(data, amount) {
        const before = levelIndex(data.xp);
        data.xp += amount;
        touchStreak(data);
        const t = today();
        const entry = data.xpLog.find(x => x.date === t);
        if (entry) entry.xp += amount;
        else data.xpLog.push({ date: t, xp: amount });
        data.xpLog = data.xpLog.slice(-60);
        const after = levelIndex(data.xp);
        return after > before ? LEVELS[after][0] : null;
      }

      function xpOn(data, date) {
        const entry = data.xpLog.find(x => x.date === date);
        return entry ? entry.xp : 0;
      }

      function recentXpDays(data) {
        const t = today();
        return Array.from({ length: 7 }, (_, i) => {
          const date = addDays(t, i - 6);
          const d = new Date(date + 'T00:00:00');
          return { label: `${d.getMonth() + 1}/${d.getDate()}`, xp: xpOn(data, date) };
        });
      }

      function pendingReviews(data) {
        const t = today();
        const overdue = [];
        const due = [];
        for (const batch of data.batches) {
          if (!batch.learnedAt) continue;
          const diff = dayDiff(batch.learnedAt, t) - batch.delayDays;
          for (const interval of INTERVALS) {
            if (batch.done.includes(interval)) continue;
            if (diff >= interval) {
              const item = { batch, interval };
              if (diff > interval) overdue.push(item);
              else due.push(item);
              break;
            }
          }
        }
        return { overdue, due };
      }

      function activeReviewBatches(data) {
        return data.batches.filter(batch => batch.learnedAt && batch.done.length < INTERVALS.length);
      }

      function allReviewsDone(data) {
        const pending = pendingReviews(data);
        return pending.overdue.length + pending.due.length === 0;
      }

      function subjectTag(subject) {
        if (subject === 'spanish') return 'tag spanish';
        if (subject === 'english') return 'tag';
        return 'tag task';
      }

      function subjectLabel(subject) {
        if (subject === 'english') return '영어';
        if (subject === 'spanish') return '스페인어';
        return subject;
      }

      function difficultyLabel(difficulty) {
        return {
          light: '가벼움',
          normal: '보통',
          hard: '어려움',
          deep: '깊게 파기',
        }[difficulty] || '보통';
      }

      function taskXp(difficulty, completion) {
        const pct = Math.max(0, Math.min(100, Number(completion) || 0));
        const base = XP.taskBase[difficulty] || XP.taskBase.normal;
        const bonus = pct === 100 ? (XP.taskPerfectBonus[difficulty] || XP.taskPerfectBonus.normal) : 0;
        return Math.round(base * pct / 100) + bonus;
      }

      function renderTaskSubjects(data) {
        const select = $('taskSubject');
        const selected = select.value;
        select.innerHTML = data.taskSubjects
          .map(subject => `<option value="${esc(subject)}">${esc(subject)}</option>`)
          .join('');
        if (data.taskSubjects.includes(selected)) select.value = selected;
      }

      function completedBeforeNextReview(nextReview) {
        const target = Number(nextReview);
        if (!INTERVALS.includes(target)) return [];
        return INTERVALS.filter(interval => interval < target);
      }

      function dots(done) {
        return INTERVALS.map((interval, index) => {
          let cls = 'dot';
          if (done.includes(interval)) cls += ' done';
          else if (index === done.length) cls += ' next';
          return `<span class="${cls}" title="+${interval}일"></span>`;
        }).join('');
      }

      function reviewHtml(item, isOverdue) {
        const b = item.batch;
        const label = isOverdue ? `+${item.interval}일 복습 밀림` : `+${item.interval}일 복습`;
        return `
          <div class="item${isOverdue ? ' overdue' : ''}">
            <span class="${subjectTag(b.subject)}">${subjectLabel(b.subject)}</span>
            <div class="item-main">
              <div class="item-title">${esc(b.name)}</div>
              <div class="item-sub">${fmtDate(b.learnedAt)} 학습 · ${label}</div>
            </div>
            <button class="btn good small" data-complete-review="${b.id}" data-interval="${item.interval}">완료</button>
          </div>`;
      }

      function taskHtml(task) {
        return `
          <div class="item">
            <span class="tag task">${esc(task.subject)}</span>
            <div class="item-main">
              <div class="item-title">${esc(task.name)}</div>
              <div class="item-sub">난이도 ${difficultyLabel(task.difficulty)} · 100% 완료 시 +${taskXp(task.difficulty, 100)} XP</div>
            </div>
            <div class="report-row">
              <div class="completion-control">
                <input type="range" min="0" max="100" step="5" value="${task.completion || 0}" data-task-percent="${task.id}" aria-label="성취도">
                <span class="completion-value" data-task-percent-value="${task.id}">${task.completion || 0}%</span>
              </div>
              <button class="btn good small" data-report-task="${task.id}">성취도 기록</button>
              <button class="btn bad small" data-delete-task="${task.id}">삭제</button>
            </div>
          </div>`;
      }

      function batchHtml(batch) {
        const mastered = batch.done.length === INTERVALS.length;
        if (!batch.learnedAt) {
          return `
            <div class="item">
              <span class="${subjectTag(batch.subject)}">${subjectLabel(batch.subject)}</span>
              <div class="item-main">
                <div class="item-title">${esc(batch.name)}</div>
                <div class="item-sub">${fmtDate(batch.registeredAt)} 등록 · 아직 학습 전</div>
                <div class="dots">${dots([])}</div>
              </div>
              <div class="report-row">
                <button class="btn good small" data-learn-batch="${batch.id}">학습 완료</button>
                <button class="btn bad small" data-delete-batch="${batch.id}">삭제</button>
              </div>
            </div>`;
        }
        const diff = dayDiff(batch.learnedAt, today());
        const next = INTERVALS.find(x => !batch.done.includes(x));
        let status = '완전 암기';
        if (!mastered) {
          const left = next - (diff - batch.delayDays);
          status = left <= 0 ? `+${next}일 복습 대기` : `+${next}일 복습까지 ${left}일`;
          if (batch.delayDays) status += ` · ${batch.delayDays}일 미룸`;
        }
        return `
          <div class="item">
            <span class="${subjectTag(batch.subject)}">${subjectLabel(batch.subject)}</span>
            <div class="item-main">
              <div class="item-title">${esc(batch.name)}</div>
              <div class="item-sub">${fmtDate(batch.learnedAt)} 학습 · ${status}</div>
              <div class="dots">${dots(batch.done)}</div>
            </div>
            <button class="btn bad small" data-delete-batch="${batch.id}">삭제</button>
          </div>`;
      }

      function renderTimer() {
        const clock = $('clock');
        const bar = $('timerBar');
        const note = $('timerNote');
        if (timer.state === 'idle') {
          clock.textContent = '00:00';
          clock.className = 'clock ok';
          bar.style.width = '0';
          bar.style.background = 'var(--good)';
          note.textContent = '타이머를 켜고 복습을 시작하세요.';
          return;
        }

        const ratio = timer.total ? timer.remaining / timer.total : 0;
        const mm = Math.floor(timer.remaining / 60);
        const ss = timer.remaining % 60;
        clock.textContent = `${pad(mm)}:${pad(ss)}`;
        bar.style.width = `${Math.round(ratio * 100)}%`;
        if (timer.state === 'success') {
          clock.className = 'clock ok';
          bar.style.background = 'var(--good)';
          note.textContent = '목표 달성. 보너스 XP가 지급됐습니다.';
        } else if (timer.state === 'expired') {
          clock.className = 'clock bad';
          bar.style.background = 'var(--bad)';
          note.textContent = '시간 초과. 복습 완료 XP는 그대로 받을 수 있습니다.';
        } else if (ratio > .5) {
          clock.className = 'clock ok';
          bar.style.background = 'var(--good)';
          note.textContent = '좋은 페이스입니다.';
        } else if (ratio > .2) {
          clock.className = 'clock warn';
          bar.style.background = 'var(--warn)';
          note.textContent = '슬슬 촉박합니다.';
        } else {
          clock.className = 'clock bad';
          bar.style.background = 'var(--bad)';
          note.textContent = '마감 모드.';
        }
      }

      function render() {
        const data = load();
        renderTaskSubjects(data);
        renderedStudyDay = today();
        const level = levelIndex(data.xp);
        const current = LEVELS[level];
        const next = LEVELS[level + 1];
        const progress = next ? Math.round(((data.xp - current[1]) / (next[1] - current[1])) * 100) : 100;
        $('levelName').textContent = `Lv.${level + 1} ${current[0]}`;
        $('xpText').textContent = `${data.xp} XP`;
        $('xpFill').style.width = `${progress}%`;
        $('levelRange').textContent = next ? `${data.xp} / ${next[1]} XP` : `${data.xp} XP`;
        $('nextXp').textContent = next ? `다음 레벨까지 ${next[1] - data.xp} XP` : '최고 레벨 달성';

        const pending = pendingReviews(data);
        const activeBatches = activeReviewBatches(data);
        const tasks = data.tasks.filter(t => t.date === today() && !t.done);
        const todoCount = pending.overdue.length + pending.due.length + tasks.length;
        const todayXp = xpOn(data, today());
        const recentDays = recentXpDays(data);
        const avgXp = Math.round(recentDays.reduce((sum, day) => sum + day.xp, 0) / recentDays.length);
        $('todayCount').textContent = `${todoCount}개`;
        $('todayXpCard').textContent = `+${todayXp}`;
        $('todayTodoCard').textContent = todoCount;
        $('streakCard').textContent = data.streak;
        $('shiftSummary').textContent = activeBatches.length
          ? `진행 중인 어휘 배치 ${activeBatches.length}개에 적용됩니다.`
          : '진행 중인 어휘 배치가 없습니다.';
        $('overdueList').innerHTML = pending.overdue.length
          ? pending.overdue.map(x => reviewHtml(x, true)).join('')
          : '<div class="empty">밀린 복습이 없습니다.</div>';
        $('dueList').innerHTML = pending.due.length
          ? pending.due.map(x => reviewHtml(x, false)).join('')
          : '<div class="empty">오늘 예정된 복습이 없습니다.</div>';
        $('taskList').innerHTML = tasks.length
          ? tasks.map(taskHtml).join('')
          : '<div class="empty">오늘 과제가 없습니다.</div>';

        const sortedBatches = [...data.batches].sort((a, b) => {
          const aDate = a.learnedAt || a.registeredAt;
          const bDate = b.learnedAt || b.registeredAt;
          return bDate.localeCompare(aDate);
        });
        $('batchList').innerHTML = sortedBatches.length
          ? sortedBatches.map(batchHtml).join('')
          : '<div class="empty">아직 등록된 어휘 배치가 없습니다.</div>';

        $('statXp').textContent = data.xp;
        $('statTodayXp').textContent = todayXp;
        $('statAvgXp').textContent = avgXp;
        $('statMastered').textContent = data.batches.filter(b => b.done.length === INTERVALS.length).length;
        $('statStreak').textContent = data.streak;
        renderBars(data);
        renderTimer();
      }

      function renderBars(data) {
        const days = recentXpDays(data);
        const max = Math.max(...days.map(d => d.xp), 1);
        $('xpBars').innerHTML = days.map(day => `
          <div class="bar-col">
            <div>${day.xp || ''}</div>
            <div class="bar" style="height:${Math.max(3, Math.round(day.xp / max * 78))}px"></div>
            <div>${day.label}</div>
          </div>`).join('');
      }

      function startTimer(minutes) {
        const total = minutes * 60;
        timer = { state: 'running', total, remaining: total, bonus: false };
        clearInterval(timerId);
        timerId = setInterval(() => {
          if (timer.state !== 'running') return;
          timer.remaining -= 1;
          if (timer.remaining <= 0) {
            timer.remaining = 0;
            timer.state = 'expired';
            clearInterval(timerId);
          }
          renderTimer();
        }, 1000);
        renderTimer();
      }

      function stopTimer() {
        clearInterval(timerId);
        timer = { state: 'idle', total: 0, remaining: 0, bonus: false };
        renderTimer();
      }

      function awardTimerBonus(data) {
        if (timer.state !== 'running' || timer.bonus) return { awarded: false, levelUp: null };
        if (!allReviewsDone(data)) return { awarded: false, levelUp: null };
        timer.bonus = true;
        timer.state = 'success';
        clearInterval(timerId);
        const levelUp = addXp(data, XP.timerBonus);
        return { awarded: true, levelUp };
      }

      $('vocabForm').addEventListener('submit', event => {
        event.preventDefault();
        const name = $('vocabName').value.trim();
        if (!name) return;
        const nextReview = $('vocabNextReview').value;
        const learnedAt = $('vocabLearnedAt').value || null;
        if (nextReview !== 'none' && !learnedAt) {
          toast('복습 회차를 지정하려면 학습일을 입력하세요.');
          return;
        }
        const data = load();
        data.batches.push({
          id: uid(),
          subject: $('vocabSubject').value,
          name,
          registeredAt: today(),
          learnedAt,
          done: completedBeforeNextReview(nextReview),
          delayDays: 0,
        });
        save(data);
        $('vocabName').value = '';
        $('vocabLearnedAt').value = '';
        $('vocabNextReview').value = 'none';
        toast(learnedAt ? `복습 상태를 반영해 등록했습니다.` : '어휘 배치를 등록했습니다. 학습 완료 시 XP가 지급됩니다.');
        render();
      });

      $('taskForm').addEventListener('submit', event => {
        event.preventDefault();
        const name = $('taskName').value.trim();
        if (!name) return;
        const data = load();
        data.tasks.push({
          id: uid(),
          subject: $('taskSubject').value,
          name,
          difficulty: $('taskDifficulty').value,
          completion: 0,
          xpAwarded: 0,
          date: today(),
          done: false,
        });
        save(data);
        $('taskName').value = '';
        toast('과제를 추가했습니다.');
        render();
      });

      $('addTaskSubjectBtn').addEventListener('click', () => {
        const subject = $('newTaskSubject').value.trim();
        if (!subject) return;
        const data = load();
        if (!data.taskSubjects.includes(subject)) data.taskSubjects.push(subject);
        save(data);
        $('newTaskSubject').value = '';
        render();
        $('taskSubject').value = subject;
        toast(`분야를 추가했습니다: ${subject}`);
      });

      $('shiftReviewsBtn').addEventListener('click', () => {
        const days = Number($('reviewShiftDays').value);
        const data = load();
        const targets = activeReviewBatches(data);
        if (!targets.length) {
          toast('미룰 복습 일정이 없습니다.');
          return;
        }
        for (const batch of targets) {
          batch.delayDays = (Number(batch.delayDays) || 0) + days;
        }
        save(data);
        toast(`어휘 복습 일정 ${targets.length}개를 ${days}일 미뤘습니다.`);
        render();
      });

      document.body.addEventListener('click', event => {
        const dateToggle = event.target.closest('#vocabDateToggle, #vocabLearnedAt');
        if (dateToggle) {
          openCalendar();
          return;
        }

        if (event.target.closest('[data-calendar-prev]')) {
          calendarMonth.setMonth(calendarMonth.getMonth() - 1);
          renderCalendar();
          return;
        }

        if (event.target.closest('[data-calendar-next]')) {
          calendarMonth.setMonth(calendarMonth.getMonth() + 1);
          renderCalendar();
          return;
        }

        const calendarDay = event.target.closest('[data-date]');
        if (calendarDay) {
          $('vocabLearnedAt').value = calendarDay.dataset.date;
          closeCalendar();
          return;
        }

        if (!event.target.closest('.date-control')) closeCalendar();

        const timerButton = event.target.closest('[data-timer]');
        if (timerButton) {
          startTimer(Number(timerButton.dataset.timer));
          return;
        }

        const reviewButton = event.target.closest('[data-complete-review]');
        if (reviewButton) {
          const data = load();
          const batch = data.batches.find(b => b.id === reviewButton.dataset.completeReview);
          const interval = Number(reviewButton.dataset.interval);
          if (batch && !batch.done.includes(interval)) {
            batch.done.push(interval);
            const levelUp = addXp(data, XP.review[interval]);
            const bonus = awardTimerBonus(data);
            save(data);
            const earned = `복습 완료 +${XP.review[interval]} XP${bonus.awarded ? ` · 목표 달성 +${XP.timerBonus} XP` : ''}`;
            toast(levelUp || bonus.levelUp ? `레벨 업: ${bonus.levelUp || levelUp}` : earned);
            render();
          }
          return;
        }

        const learnButton = event.target.closest('[data-learn-batch]');
        if (learnButton) {
          const data = load();
          const batch = data.batches.find(b => b.id === learnButton.dataset.learnBatch);
          if (batch && !batch.learnedAt) {
            batch.learnedAt = today();
            batch.done = [];
            const levelUp = addXp(data, XP.initialStudy);
            save(data);
            toast(levelUp ? `레벨 업: ${levelUp}` : `학습 완료 +${XP.initialStudy} XP`);
            render();
          }
          return;
        }

        const taskButton = event.target.closest('[data-report-task]');
        if (taskButton) {
          const data = load();
          const task = data.tasks.find(t => t.id === taskButton.dataset.reportTask);
          const input = document.querySelector(`[data-task-percent="${taskButton.dataset.reportTask}"]`);
          const completion = Math.max(0, Math.min(100, Number(input && input.value) || 0));
          if (task && !task.done) {
            task.completion = completion;
            task.done = true;
            const amount = taskXp(task.difficulty, completion);
            task.xpAwarded = amount;
            const levelUp = amount > 0 ? addXp(data, amount) : null;
            save(data);
            if (amount > 0) toast(levelUp ? `레벨 업: ${levelUp}` : `성취도 ${completion}% · +${amount} XP`);
            else toast(`성취도 ${completion}% 기록`);
            render();
          }
          return;
        }

        const deleteButton = event.target.closest('[data-delete-batch]');
        if (deleteButton) {
          const data = load();
          data.batches = data.batches.filter(b => b.id !== deleteButton.dataset.deleteBatch);
          save(data);
          toast('배치를 삭제했습니다.');
          render();
          return;
        }

        const deleteTaskButton = event.target.closest('[data-delete-task]');
        if (deleteTaskButton) {
          const data = load();
          data.tasks = data.tasks.filter(t => t.id !== deleteTaskButton.dataset.deleteTask);
          save(data);
          toast('과제를 삭제했습니다.');
          render();
        }
      });

      document.body.addEventListener('input', event => {
        const slider = event.target.closest('[data-task-percent]');
        if (!slider) return;
        const value = document.querySelector(`[data-task-percent-value="${slider.dataset.taskPercent}"]`);
        if (value) value.textContent = `${slider.value}%`;
      });

      $('brandRefresh').addEventListener('click', () => {
        window.location.reload();
      });

      $('customTimerBtn').addEventListener('click', () => {
        const minutes = Number($('customMinutes').value);
        if (!minutes || minutes < 1 || minutes > 99) {
          toast('1~99분 사이로 입력하세요.');
          return;
        }
        startTimer(minutes);
      });

      $('stopTimerBtn').addEventListener('click', stopTimer);

      const ok = await loadCloudState();
      render();
      if (!ok) $('syncStatus').textContent = '로컬 임시 모드';
      setInterval(() => {
        if (today() !== renderedStudyDay) render();
      }, 60000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
